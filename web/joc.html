oke-width=\"3\" opacity=\".6\"/>"}, {"id": 19, "nom": "ATM", "cat": "Gene / protein", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "suppressors"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>ATM<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/ox/8oxq/8oxq_assembly-1.jpeg\" alt=\"ATM\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 8OXQ · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Serine/threonine protein kinase which activates checkpoint signaling upon double strand breaks (DSBs), apoptosis and genotoxic stresses such as ionizing ultraviolet A light (UVA), thereby acting as a DNA damage sensor (PubMed:10550055, PubMed:10839545, PubMed:10910365, PubMed:12556884, PubMed:14871926, PubMed:15064416, PubMed:15448695, PubMed:15456891, PubMed:15790808, PubMed:15916964, PubMed:17923702, PubMed:21757780, PubMed:24534091, PubMed:27941124, PubMed:35076389, PubMed:9733514). Recognizes the substrate consensus sequence [ST]-Q (PubMed:10550055, PubMed:10839545, PubMed:10910365, PubMed:12556884, PubMed:14871926, PubMed:15448695, PubMed:15456891, PubMed:15916964, PubMed:17923702, PubMed:24534091, PubMed:27941124, PubMed:9733514). Phosphorylates &#x27;Ser-139&#x27; of histone variant H2AX at double strand breaks (DSBs), thereby regulating DNA damage response mechanism (By similarity). Also plays a role in pre-B cell allelic exclusion, a process leading to expression of a single immunoglobulin heavy chain allele to enforce clonality and monospecific recognition by the B-cell antigen receptor (BCR) expressed on individual B-lymphocytes. After the introduction of DNA breaks by the RAG complex on one immunoglobulin allele, acts by mediating a repositioning of the second allele to pericentromeric heterochromatin, preventing accessibility to the RAG complex and recombination of the second allele. Also involved in signal transduction and cell cycle control. May function as a tumor suppressor. Necessary for activation of ABL1 and SAPK. Phosphorylates DYRK2, CHEK2, p53/TP53, FBXW7, FANCD2, NFKBIA, BRCA1, CREBBP/CBP, RBBP8/CTIP, FBXO46, MRE11, nibrin (NBN), RAD50, RAD17, PELI1, TERF1, UFL1, RAD9, UBQLN4, UCHL3 and DCLRE1C (PubMed:10550055, PubMed:10766245, PubMed:10802669, PubMed:10839545, PubMed:10910365, PubMed:10973490, PubMed:11375976, PubMed:12086603, PubMed:15456891, PubMed:19965871, PubMed:21757780, PubMed:24534091, PubMed:26240375, PubMed:26774286, PubMed:27941124, PubMed:30171069, PubMed:30612738, PubMed:30886146, PubMed:30952868, PubMed:38128537, PubMed:9733515, PubMed:9843217). May play a role in vesicle and/or protein transport. Could play a role in T-cell development, gonad and neurological function. Plays a role in replication-dependent histone mRNA degradation. Binds DNA ends. Phosphorylation of DYRK2 in nucleus in response to genotoxic stress prevents its MDM2-mediated ubiquitination and subsequent proteasome degradation (PubMed:19965871). Phosphorylates ATF2 which stimulates its function in DNA damage response (PubMed:15916964). Phosphorylates ERCC6 which is essential for its chromatin remodeling activity at DNA double-strand breaks (PubMed:29203878). Phosphorylates TTC5/STRAP at &#x27;Ser-203&#x27; in the cytoplasm in response to DNA damage, which promotes TTC5/STRAP nuclear localization (PubMed:15448695). Also involved in pexophagy by mediating phosphorylation of PEX5: translocated to peroxisomes in response to reactive oxygen species (ROS), and catalyzes phosphorylation of PEX5, promoting PEX5 ubiquitination and induction of pexophagy (PubMed:26344566)<\/p><p class=\"font\">Source: UniProt Q13315 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>11<\/b><\/li><li><span>Length (aa)<\/span><b>3056<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 27, "nom": "BCL2", "cat": "Gene / protein", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>BCL2<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/ht/8hts/8hts_assembly-1.jpeg\" alt=\"BCL2\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 8HTS · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Suppresses apoptosis in a variety of cell systems including factor-dependent lymphohematopoietic and neural cells (PubMed:1508712, PubMed:8183370). Regulates cell death by controlling the mitochondrial membrane permeability (PubMed:11368354). Appears to function in a feedback loop system with caspases (PubMed:11368354). Inhibits caspase activity either by preventing the release of cytochrome c from the mitochondria and/or by binding to the apoptosis-activating factor (APAF-1) (PubMed:11368354). Also acts as an inhibitor of autophagy: interacts with BECN1 and AMBRA1 during non-starvation conditions and inhibits their autophagy function (PubMed:18570871, PubMed:20889974, PubMed:21358617). May attenuate inflammation by impairing NLRP1-inflammasome activation, hence CASP1 activation and IL1B release (PubMed:17418785)<\/p><p class=\"font\">Source: UniProt P10415 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>18<\/b><\/li><li><span>Length (aa)<\/span><b>239<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 23, "nom": "BRAF", "cat": "Gene / protein", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>BRAF<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/vy/8vys/8vys_assembly-1.jpeg\" alt=\"BRAF\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 8VYS · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Protein kinase involved in the transduction of mitogenic signals from the cell membrane to the nucleus (Probable). Phosphorylates MAP2K1, and thereby activates the MAP kinase signal transduction pathway (PubMed:21441910, PubMed:29433126). Phosphorylates PFKFB2 (PubMed:36402789). May play a role in the postsynaptic responses of hippocampal neurons (PubMed:1508179)<\/p><p class=\"font\">Source: UniProt P15056 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>7<\/b><\/li><li><span>Length (aa)<\/span><b>766<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 2, "nom": "BRCA1", "cat": "Gene / protein", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "suppressors"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>BRCA1<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/rs/8rs8/8rs8_assembly-1.jpeg\" alt=\"BRCA1\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 8RS8 · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">E3 ubiquitin-protein ligase that specifically mediates the formation of &#x27;Lys-6&#x27;-linked polyubiquitin chains and plays a central role in DNA repair by facilitating cellular responses to DNA damage (PubMed:10500182, PubMed:12887909, PubMed:12890688, PubMed:14976165, PubMed:16818604, PubMed:17525340, PubMed:19261748). It is unclear whether it also mediates the formation of other types of polyubiquitin chains (PubMed:12890688). The BRCA1-BARD1 heterodimer coordinates a diverse range of cellular pathways such as DNA damage repair, ubiquitination and transcriptional regulation to maintain genomic stability (PubMed:12890688, PubMed:14976165, PubMed:20351172). Regulates centrosomal microtubule nucleation (PubMed:18056443). Required for appropriate cell cycle arrests after ionizing irradiation in both the S-phase and the G2 phase of the cell cycle (PubMed:10724175, PubMed:11836499, PubMed:12183412, PubMed:19261748). Required for FANCD2 targeting to sites of DNA damage (PubMed:12887909). Inhibits lipid synthesis by binding to inactive phosphorylated ACACA and preventing its dephosphorylation (PubMed:16326698). Contributes to homologous recombination repair (HRR) via its direct interaction with PALB2, fine-tunes recombinational repair partly through its modulatory role in the PALB2-dependent loading of BRCA2-RAD51 repair machinery at DNA breaks (PubMed:19369211). Component of the BRCA1-RBBP8 complex which regulates CHEK1 activation and controls cell cycle G2/M checkpoints on DNA damage via BRCA1-mediated ubiquitination of RBBP8 (PubMed:16818604). Acts as a transcriptional activator (PubMed:20160719)<\/p><p class=\"font\">Source: UniProt P38398 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>17<\/b><\/li><li><span>Length (aa)<\/span><b>1863<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 13, "nom": "BRCA2", "cat": "Gene / protein", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "suppressors"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>BRCA2<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/ld/7ldg/7ldg_assembly-1.jpeg\" alt=\"BRCA2\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 7LDG · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Tumor suppressor protein that maintains genome stability primarily by repairing damaged DNA through homologous recombination (HR) (PubMed:11239456, PubMed:12442171, PubMed:15115758, PubMed:15199141, PubMed:15671039, PubMed:15937124, PubMed:17515903, PubMed:17515904, PubMed:18317453, PubMed:19303847, PubMed:20729832, PubMed:20729858, PubMed:20729859, PubMed:21719596, PubMed:27941124, PubMed:37499663, PubMed:37515771). Facilitates the repair of double-strand breaks (DSBs) by binding and mediating the loading of the RAD51 protein onto single-stranded DNA (ssDNA), thereby promoting the activity of RAD51, which catalyzes DNA strand exchange (PubMed:11239456, PubMed:12442171, PubMed:15937124, PubMed:17515903, PubMed:17515904, PubMed:18317453, PubMed:19303847, PubMed:20729832, PubMed:20729858, PubMed:20729859, PubMed:27941124, PubMed:37499663). BRCA2 nucleates and stabilizes RAD51 on ssDNA directly and delivers RAD51 to ssDNA-double-stranded DNA (dsDNA) junctions by sliding along dsDNA backbone (PubMed:12442171, PubMed:19303847, PubMed:37499663). RAD51 targeting to ssDNA promotes removal of replication protein-A (RPA) from ssDNA and stabilization of RAD51-ssDNA filaments by blocking ATP hydrolysis (PubMed:20729859). May play a role in the extension step after strand invasion at replication-dependent DNA double-strand breaks; together with PALB2 is involved in both POLH localization at collapsed replication forks and DNA polymerization activity (PubMed:24485656). Required to prevent R-loop-associated DNA damage and thus transcription-associated genomic instability (PubMed:24896180). Silencing of BRCA2 promotes R-loop accumulation at actively transcribed genes in replicating and non-replicating cells, suggesting that BRCA2 mediates the control of R-loop associated genomic instability, independently of its known role in homologous recombination (PubMed:24896180). Also promotes RAD51 loading to telomeric regions, facilitating telomere replication and capping (PubMed:21076401). Also required for homologous recombination during meiosis by promoting the recruitment of RAD51 and DMC1 recombinases to meiotic DSB sites, enabling proper chromosome pairing and crossing over (PubMed:26976601). Also promotes homologous recombination by inactivating the FIGNL1-FIRRM complex to protect RAD51 filament from premature disassembly (PubMed:37515771). Together with NPM1, may also regulate centrosome duplication (PubMed:21084279)<\/p><p class=\"font\">Source: UniProt P51587 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>13<\/b><\/li><li><span>Length (aa)<\/span><b>3418<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 36, "nom": "CD274", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "immunotherapy"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>CD274<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/xa/7xad/7xad_assembly-1.jpeg\" alt=\"CD274\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 7XAD · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Plays a critical role in induction and maintenance of immune tolerance to self (PubMed:11015443, PubMed:28813410, PubMed:28813417, PubMed:31399419). As a ligand for the inhibitory receptor PDCD1/PD-1, modulates the activation threshold of T-cells and limits T-cell effector response (PubMed:11015443, PubMed:28813410, PubMed:28813417, PubMed:36727298). Through a yet unknown activating receptor, may costimulate T-cell subsets that predominantly produce interleukin-10 (IL10) (PubMed:10581077). Can also act as a transcription coactivator: in response to hypoxia, translocates into the nucleus via its interaction with phosphorylated STAT3 and promotes transcription of GSDMC, leading to pyroptosis (PubMed:32929201)<\/p><p class=\"font\">Source: UniProt Q9NZQ7 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>9<\/b><\/li><li><span>Length (aa)<\/span><b>290<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 28, "nom": "CDK4", "cat": "Gene / protein", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>CDK4<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/cs/9csk/9csk_assembly-1.jpeg\" alt=\"CDK4\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 9CSK · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Ser/Thr-kinase component of cyclin D-CDK4 (DC) complexes that phosphorylate and inhibit members of the retinoblastoma (RB) protein family including RB1 and regulate the cell-cycle during G(1)/S transition. Phosphorylation of RB1 allows dissociation of the transcription factor E2F from the RB/E2F complexes and the subsequent transcription of E2F target genes which are responsible for the progression through the G(1) phase. Hypophosphorylates RB1 in early G(1) phase. Cyclin D-CDK4 complexes are major integrators of various mitogenenic and antimitogenic signals. Also phosphorylates SMAD3 in a cell-cycle-dependent manner and represses its transcriptional activity. Component of the ternary complex, cyclin D/CDK4/CDKN1B, required for nuclear translocation and activity of the cyclin D-CDK4 complex<\/p><p class=\"font\">Source: UniProt P11802 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>12<\/b><\/li><li><span>Length (aa)<\/span><b>303<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 17, "nom": "CDKN2A", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "suppressors"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>CDKN2A<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/oz/7ozt/7ozt_assembly-1.jpeg\" alt=\"CDKN2A\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 7OZT · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Acts as a negative regulator of the proliferation of normal cells by interacting strongly with CDK4 and CDK6. This inhibits their ability to interact with cyclins D and to phosphorylate the retinoblastoma protein<\/p><p class=\"font\">Source: UniProt P42771 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>9<\/b><\/li><li><span>Length (aa)<\/span><b>156<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 32, "nom": "CTNNB1", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>CTNNB1<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/z6/2z6h/2z6h_assembly-1.jpeg\" alt=\"CTNNB1\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 2Z6H · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Key downstream component of the canonical Wnt signaling pathway (PubMed:17524503, PubMed:18077326, PubMed:18086858, PubMed:18957423, PubMed:21262353, PubMed:22155184, PubMed:22647378, PubMed:22699938). In the absence of Wnt, forms a complex with AXIN1, AXIN2, APC, CSNK1A1 and GSK3B that promotes phosphorylation on N-terminal Ser and Thr residues and ubiquitination of CTNNB1 via BTRC and its subsequent degradation by the proteasome (PubMed:17524503, PubMed:18077326, PubMed:18086858, PubMed:18957423, PubMed:21262353, PubMed:22155184, PubMed:22647378, PubMed:22699938). In the presence of Wnt ligand, CTNNB1 is not ubiquitinated and accumulates in the nucleus, where it acts as a coactivator for transcription factors of the TCF/LEF family, leading to activate Wnt responsive genes (PubMed:17524503, PubMed:18077326, PubMed:18086858, PubMed:18957423, PubMed:21262353, PubMed:22155184, PubMed:22647378, PubMed:22699938). Also acts as a coactivator for other transcription factors, such as NR5A2 (PubMed:22187462). Promotes epithelial to mesenchymal transition/mesenchymal to epithelial transition (EMT/MET) via driving transcription of CTNNB1/TCF-target genes (PubMed:29910125). Involved in the regulation of cell adhesion, as component of an E-cadherin:catenin adhesion complex (By similarity). Acts as a negative regulator of centrosome cohesion (PubMed:18086858). Involved in the CDK2/PTPN6/CTNNB1/CEACAM1 pathway of insulin internalization (PubMed:21262353). Blocks anoikis of malignant kidney and intestinal epithelial cells and promotes their anchorage-independent growth by down-regulating DAPK2 (PubMed:18957423). Disrupts PML function and PML-NB formation by inhibiting RANBP2-mediated sumoylation of PML (PubMed:22155184). Promotes neurogenesis by maintaining sympathetic neuroblasts within the cell cycle (By similarity). Involved in chondrocyte differentiation via interaction with SOX9: SOX9-binding competes with the binding sites of TCF/LEF within CTNNB1, thereby inhibiting the Wnt signaling (By similarity). Acts as a positive regulator of odontoblast differentiation during mesenchymal tooth germ formation, via promoting the transcription of differentiation factors such as LEF1, BMP2 and BMP4 (By similarity). Activity is repressed in a MSX1-mediated manner at the bell stage of mesenchymal tooth germ formation which prevents premature differentiation of odontoblasts (By similarity)<\/p><p class=\"font\">Source: UniProt P35222 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>3<\/b><\/li><li><span>Length (aa)<\/span><b>781<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 4, "nom": "EGFR", "cat": "Gene / protein", "raresa": "epica", "rlabel": "Epic", "color": "#8e4fd1", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#8e4fd1\"><header><h2>EGFR<\/h2><span>Epic<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/sy/7syd/7syd_assembly-1.jpeg\" alt=\"EGFR\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 7SYD · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Receptor tyrosine kinase binding ligands of the EGF family and activating several signaling cascades to convert extracellular cues into appropriate cellular responses (PubMed:10805725, PubMed:12297050, PubMed:12620237, PubMed:12873986, PubMed:15374980, PubMed:15590694, PubMed:17115032, PubMed:19560417, PubMed:21258366, PubMed:27153536, PubMed:2790960, PubMed:35538033, PubMed:9488479). Known ligands include EGF, TGFA/TGF-alpha, AREG, epigen/EPGN, BTC/betacellulin, epiregulin/EREG and HBEGF/heparin-binding EGF (PubMed:12297049, PubMed:15611079, PubMed:17909029, PubMed:20837704, PubMed:27153536, PubMed:2790960, PubMed:7679104, PubMed:8144591, PubMed:9419975). Ligand binding triggers receptor homo- and/or heterodimerization and autophosphorylation on key cytoplasmic residues (PubMed:10026169, PubMed:17349580, PubMed:18046415, PubMed:19560417, PubMed:19836242). The phosphorylated receptor recruits adapter proteins like GRB2 which in turn activates complex downstream signaling cascades (PubMed:10026169, PubMed:17349580, PubMed:18046415, PubMed:19560417, PubMed:19836242). Activates at least 4 major downstream signaling cascades including the RAS-RAF-MEK-ERK, PI3 kinase-AKT, PLCgamma-PKC and STATs modules (PubMed:27153536). May also activate the NF-kappa-B signaling cascade (PubMed:11116146). Also directly phosphorylates other proteins like RGS16, activating its GTPase activity and probably coupling the EGF receptor signaling to the G protein-coupled receptor signaling (PubMed:11602604). Also phosphorylates MUC1 and increases its interaction with SRC and CTNNB1/beta-catenin (PubMed:11483589). Positively regulates cell migration via interaction with CCDC88A/GIV which retains EGFR at the cell membrane following ligand stimulation, promoting EGFR signaling which triggers cell migration (PubMed:20462955). Acts as a positive regulator of cGAS-STING signaling by mediating tyrosine phosphorylation of STING1, promoting production of type I interferon (IFN-alpha and IFN-beta), while inhibiting STING1 ability to regulate autophagy (PubMed:32926474). Plays a role in enhancing learning and memory performance (By similarity). Plays a role in mammalian pain signaling (long-lasting hypersensitivity) (By similarity)<\/p><p class=\"font\">Source: UniProt P00533 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>7<\/b><\/li><li><span>Length (aa)<\/span><b>1210<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 25, "nom": "ERBB2", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>ERBB2<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/mn/7mn5/7mn5_assembly-1.jpeg\" alt=\"ERBB2\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 7MN5 · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Protein tyrosine kinase that is part of several cell surface receptor complexes, but that apparently needs a coreceptor for ligand binding. Essential component of a neuregulin-receptor complex, although neuregulins do not interact with it alone. GP30 is a potential ligand for this receptor. Regulates outgrowth and stabilization of peripheral microtubules (MTs). Upon ERBB2 activation, the MEMO1-RHOA-DIAPH1 signaling pathway elicits the phosphorylation and thus the inhibition of GSK3B at cell membrane. This prevents the phosphorylation of APC and CLASP2, allowing its association with the cell membrane. In turn, membrane-bound APC allows the localization of MACF1 to the cell membrane, which is required for microtubule capture and stabilization<\/p><p class=\"font\">Source: UniProt P04626 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>17<\/b><\/li><li><span>Length (aa)<\/span><b>1255<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 21, "nom": "HRAS", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>HRAS<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/el/8elt/8elt_assembly-1.jpeg\" alt=\"HRAS\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 8ELT · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Signal transducer in the Ras-MAPK signaling pathway that regulates cell proliferation and survival (PubMed:22821884). Ras proteins bind GDP/GTP and possess intrinsic GTPase activity (PubMed:12740440, PubMed:14500341, PubMed:9020151). Recognized by LZTR1 that mediates its ubiquitination by a BCR (BTB-CUL3-RBX1) E3 ubiquitin-protein ligase complex (PubMed:40934300)<\/p><p class=\"font\">Source: UniProt P01112 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>11<\/b><\/li><li><span>Length (aa)<\/span><b>189<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 33, "nom": "IDH1", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>IDH1<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/bk/6bkx/6bkx_assembly-1.jpeg\" alt=\"IDH1\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 6BKX · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Catalyzes the NADP(+)-dependent oxidative decarboxylation of isocitrate (D-threo-isocitrate) to 2-ketoglutarate (2-oxoglutarate), which is required by other enzymes such as the phytanoyl-CoA dioxygenase (PubMed:10521434, PubMed:19935646). Plays a critical role in the generation of NADPH, an important cofactor in many biosynthesis pathways (PubMed:10521434). May act as a corneal epithelial crystallin and may be involved in maintaining corneal epithelial transparency (By similarity)<\/p><p class=\"font\">Source: UniProt O75874 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>2<\/b><\/li><li><span>Length (aa)<\/span><b>414<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 3, "nom": "KRAS", "cat": "Gene / protein", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>KRAS<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/ro/7rov/7rov_assembly-1.jpeg\" alt=\"KRAS\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 7ROV · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Signal transducer in the Ras-MAPK signaling pathway that regulates cell proliferation and survival (PubMed:22711838, PubMed:23698361). Ras proteins bind GDP/GTP and possess intrinsic GTPase activity (PubMed:20949621, PubMed:39809765). Activates MAPK1/MAPK3 resulting in phosphorylation and ultimately degradation of GJA1 (By similarity). Plays a role in promoting oncogenic events by inducing transcriptional silencing of tumor suppressor genes (TSGs) in colorectal cancer (CRC) cells in a ZNF304-dependent manner (PubMed:24623306). Recognized by LZTR1 that mediates its ubiquitination by a BCR (BTB-CUL3-RBX1) E3 ubiquitin-protein ligase complex (PubMed:40934300)<\/p><p class=\"font\">Source: UniProt P01116 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>12<\/b><\/li><li><span>Length (aa)<\/span><b>189<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 35, "nom": "MDM2", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>MDM2<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/bg/8bgu/8bgu_assembly-1.jpeg\" alt=\"MDM2\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 8BGU · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">E3 ubiquitin-protein ligase that mediates ubiquitination of p53/TP53, leading to its degradation by the proteasome (PubMed:29681526, PubMed:21317885). Inhibits p53/TP53- and p73/TP73-mediated cell cycle arrest and apoptosis by binding its transcriptional activation domain. Also acts as a ubiquitin ligase E3 toward itself and ARRB1. Permits the nuclear export of p53/TP53. Promotes proteasome-dependent ubiquitin-independent degradation of retinoblastoma RB1 protein. Inhibits DAXX-mediated apoptosis by inducing its ubiquitination and degradation. Component of the TRIM28/KAP1-MDM2-p53/TP53 complex involved in stabilizing p53/TP53. Also a component of the TRIM28/KAP1-ERBB4-MDM2 complex which links growth factor and DNA damage response pathways. Mediates ubiquitination and subsequent proteasome degradation of DYRK2 in nucleus. Ubiquitinates IGF1R and SNAI1 and promotes them to proteasomal degradation (PubMed:12821780, PubMed:15053880, PubMed:15195100, PubMed:15632057, PubMed:16337594, PubMed:17290220, PubMed:19098711, PubMed:19219073, PubMed:19837670, PubMed:19965871, PubMed:20173098, PubMed:20385133, PubMed:20858735, PubMed:22128911). Ubiquitinates DCX, leading to DCX degradation and reduction of the dendritic spine density of olfactory bulb granule cells (By similarity). Ubiquitinates DLG4, leading to proteasomal degradation of DLG4 which is required for AMPA receptor endocytosis (By similarity). Negatively regulates NDUFS1, leading to decreased mitochondrial respiration, marked oxidative stress, and commitment to the mitochondrial pathway of apoptosis (PubMed:30879903). Binds NDUFS1 leading to its cytosolic retention rather than mitochondrial localization resulting in decreased supercomplex assembly (interactions between complex I and complex III), decreased complex I activity, ROS production, and apoptosis (PubMed:30879903)<\/p><p class=\"font\">Source: UniProt Q00987 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>12<\/b><\/li><li><span>Length (aa)<\/span><b>491<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 20, "nom": "MLH1", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "suppressors"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>MLH1<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/p7/4p7a/4p7a_assembly-1.jpeg\" alt=\"MLH1\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 4P7A · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Heterodimerizes with PMS2 to form MutL alpha, a component of the post-replicative DNA mismatch repair system (MMR). DNA repair is initiated by MutS alpha (MSH2-MSH6) or MutS beta (MSH2-MSH3) binding to a dsDNA mismatch, then MutL alpha is recruited to the heteroduplex. Assembly of the MutL-MutS-heteroduplex ternary complex in presence of RFC and PCNA is sufficient to activate endonuclease activity of PMS2. It introduces single-strand breaks near the mismatch and thus generates new entry points for the exonuclease EXO1 to degrade the strand containing the mismatch. DNA methylation would prevent cleavage and therefore assure that only the newly mutated DNA strand is going to be corrected. MutL alpha (MLH1-PMS2) interacts physically with the clamp loader subunits of DNA polymerase III, suggesting that it may play a role to recruit the DNA polymerase III to the site of the MMR. Also implicated in DNA damage signaling, a process which induces cell cycle arrest and can lead to apoptosis in case of major DNA damages. Heterodimerizes with MLH3 to form MutL gamma which plays a role in meiosis<\/p><p class=\"font\">Source: UniProt P40692 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>3<\/b><\/li><li><span>Length (aa)<\/span><b>756<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 31, "nom": "MTOR", "cat": "Gene / protein", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>MTOR<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/t9/9t94/9t94_assembly-1.jpeg\" alt=\"MTOR\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 9T94 · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Serine/threonine protein kinase which is a central regulator of cellular metabolism, growth and survival in response to hormones, growth factors, nutrients, energy and stress signals (PubMed:12087098, PubMed:12150925, PubMed:12150926, PubMed:12231510, PubMed:12718876, PubMed:14651849, PubMed:15268862, PubMed:15467718, PubMed:15545625, PubMed:15718470, PubMed:18497260, PubMed:18762023, PubMed:18925875, PubMed:20516213, PubMed:20537536, PubMed:21659604, PubMed:23429703, PubMed:23429704, PubMed:25799227, PubMed:26018084, PubMed:29150432, PubMed:29236692, PubMed:31112131, PubMed:31601708, PubMed:32561715, PubMed:34519269, PubMed:37751742). MTOR directly or indirectly regulates the phosphorylation of at least 800 proteins (PubMed:15268862, PubMed:15467718, PubMed:17517883, PubMed:18372248, PubMed:18497260, PubMed:18925875, PubMed:20516213, PubMed:21576368, PubMed:21659604, PubMed:23429704, PubMed:30171069, PubMed:29236692, PubMed:37751742). Functions as part of 2 structurally and functionally distinct signaling complexes mTORC1 and mTORC2 (mTOR complex 1 and 2) (PubMed:15268862, PubMed:15467718, PubMed:18497260, PubMed:18925875, PubMed:20516213, PubMed:21576368, PubMed:21659604, PubMed:23429704, PubMed:29424687, PubMed:29567957, PubMed:35926713). In response to nutrients, growth factors or amino acids, mTORC1 is recruited to the lysosome membrane and promotes protein, lipid and nucleotide synthesis by phosphorylating key regulators of mRNA translation and ribosome synthesis (PubMed:12087098, PubMed:12150925, PubMed:12150926, PubMed:12231510, PubMed:12718876, PubMed:14651849, PubMed:15268862, PubMed:15467718, PubMed:15545625, PubMed:15718470, PubMed:18497260, PubMed:18762023, PubMed:18925875, PubMed:20516213, PubMed:20537536, PubMed:21659604, PubMed:23429703, PubMed:23429704, PubMed:25799227, PubMed:26018084, PubMed:29150432, PubMed:29236692, PubMed:31112131, PubMed:34519269). This includes phosphorylation of EIF4EBP1 and release of its inhibition toward the elongation initiation factor 4E (eiF4E) (PubMed:24403073, PubMed:29236692). Moreover, phosphorylates and activates RPS6KB1 and RPS6KB2 that promote protein synthesis by modulating the activity of their downstream targets including ribosomal protein S6, eukaryotic translation initiation factor EIF4B, and the inhibitor of translation initiation PDCD4 (PubMed:12087098, PubMed:12150925, PubMed:18925875, PubMed:29150432, PubMed:29236692). Stimulates the pyrimidine biosynthesis pathway, both by acute regulation through RPS6KB1-mediated phosphorylation of the biosynthetic enzyme CAD, and delayed regulation, through transcriptional enhancement of the pentose phosphate pathway which produces 5-phosphoribosyl-1-pyrophosphate (PRPP), an allosteric activator of CAD at a later step in synthesis, this function is dependent on the mTORC1 complex (PubMed:23429703, PubMed:23429704). Regulates ribosome synthesis by activating RNA polymerase III-dependent transcription through phosphorylation and inhibition of MAF1 an RNA polymerase III-repressor (PubMed:20516213). Activates dormant ribosomes by mediating phosphorylation of SERBP1, leading to SERBP1 inactivation and reactivation of translation (PubMed:36691768). In parallel to protein synthesis, also regulates lipid synthesis through SREBF1/SREBP1 and LPIN1 (PubMed:23426360). To maintain energy homeostasis mTORC1 may also regulate mitochondrial biogenesis through regulation of PPARGC1A (By similarity). In the same time, mTORC1 inhibits catabolic pathways: negatively regulates autophagy through phosphorylation of ULK1 (PubMed:32561715). Under nutrient sufficiency, phosphorylates ULK1 at &#x27;Ser-758&#x27;, disrupting the interaction with AMPK and preventing activation of ULK1 (PubMed:32561715). Also prevents autophagy through phosphorylation of the autophagy inhibitor DAP (PubMed:20537536). Also prevents autophagy by phosphorylating RUBCNL/Pacer under nutrient-rich conditions (PubMed:30704899). Prevents autophagy by mediating phosphorylation of AMBRA1, thereby inhibiting AMBRA1 ability to mediate ubiquitination of ULK1 and interaction between AMBRA1 and PPP2CA (PubMed:23524951, PubMed:25438055). mTORC1 exerts a feedback control on upstream growth factor signaling that includes phosphorylation and activation of GRB10 a INSR-dependent signaling suppressor (PubMed:21659604). Among other potential targets mTORC1 may phosphorylate CLIP1 and regulate microtubules (PubMed:12231510). The mTORC1 complex is inhibited in response to starvation and amino acid depletion (PubMed:12150925, PubMed:12150926, PubMed:24403073, PubMed:31695197). The non-canonical mTORC1 complex, which acts independently of RHEB, specifically mediates phosphorylation of MiT/TFE factors MITF, TFEB and TFE3 in the presence of nutrients, promoting their cytosolic retention and inactivation (PubMed:22343943, PubMed:22576015, PubMed:22692423, PubMed:24448649, PubMed:32612235, PubMed:36608670, PubMed:36697823). Upon starvation or lysosomal stress, inhibition of mTORC1 induces dephosphorylation and nuclear translocation of TFEB and TFE3, promoting their transcription factor activity (PubMed:22343943, PubMed:22576015, PubMed:22692423, PubMed:24448649, PubMed:32612235, PubMed:36608670). The mTORC1 complex regulates pyroptosis in macrophages by promoting GSDMD oligomerization (PubMed:34289345). MTOR phosphorylates RPTOR which in turn inhibits mTORC1 (By similarity). As part of the mTORC2 complex, MTOR transduces signals from growth factors to pathways involved in proliferation, cytoskeletal organization, lipogenesis and anabolic output (PubMed:15268862, PubMed:15467718, PubMed:24670654, PubMed:29424687, PubMed:29567957, PubMed:35926713). In response to growth factors, mTORC2 phosphorylates and activates AGC protein kinase family members, including AKT (AKT1, AKT2 and AKT3), PKC (PRKCA, PRKCB and PRKCE) and SGK1 (PubMed:15268862, PubMed:15467718, PubMed:21376236, PubMed:24670654, PubMed:29424687, PubMed:29567957, PubMed:35926713). In contrast to mTORC1, mTORC2 is nutrient-insensitive (PubMed:15467718). mTORC2 plays a critical role in AKT1 activation by mediating phosphorylation of different sites depending on the context, such as &#x27;Thr-450&#x27;, &#x27;Ser-473&#x27;, &#x27;Ser-477&#x27; or &#x27;Thr-479&#x27;, facilitating the phosphorylation of the activation loop of AKT1 on &#x27;Thr-308&#x27; by PDPK1/PDK1 which is a prerequisite for full activation (PubMed:15718470, PubMed:21376236, PubMed:24670654, PubMed:29424687, PubMed:29567957). mTORC2 also regulates the phosphorylation of SGK1 at &#x27;Ser-422&#x27; (PubMed:18925875). mTORC2 may regulate the actin cytoskeleton, through phosphorylation of PRKCA, PXN and activation of the Rho-type guanine nucleotide exchange factors RHOA and RAC1A or RAC1B (PubMed:15268862). The mTORC2 complex also phosphorylates various proteins involved in insulin signaling, such as FBXW8 and IGF2BP1 (By similarity). May also regulate insulin signaling by acting as a tyrosine protein kinase that catalyzes phosphorylation of IGF1R and INSR; additional evidence are however required to confirm this result in vivo (PubMed:26584640). Regulates osteoclastogenesis by adjusting the expression of CEBPB isoforms (By similarity). Plays an important regulatory role in the circadian clock function; regulates period length and rhythm amplitude of the suprachiasmatic nucleus (SCN) and liver clocks (By similarity)<\/p><p class=\"font\">Source: UniProt P42345 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>1<\/b><\/li><li><span>Length (aa)<\/span><b>2549<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 5, "nom": "MYC", "cat": "Gene / protein", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>MYC<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/i4/5i4z/5i4z_assembly-1.jpeg\" alt=\"MYC\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 5I4Z · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Transcription factor that binds DNA in a non-specific manner, yet also specifically recognizes the core sequence 5&#x27;-CAC[GA]TG-3&#x27; (PubMed:24940000, PubMed:25956029). Activates the transcription of growth-related genes (PubMed:24940000, PubMed:25956029). Binds to the VEGFA promoter, promoting VEGFA production and subsequent sprouting angiogenesis (PubMed:24940000, PubMed:25956029). Regulator of somatic reprogramming, controls self-renewal of embryonic stem cells (By similarity). Functions with TAF6L to activate target gene expression through RNA polymerase II pause release (By similarity). Positively regulates transcription of HNRNPA1, HNRNPA2 and PTBP1 which in turn regulate splicing of pyruvate kinase PKM by binding repressively to sequences flanking PKM exon 9, inhibiting exon 9 inclusion and resulting in exon 10 inclusion and production of the PKM M2 isoform (PubMed:20010808)<\/p><p class=\"font\">Source: UniProt P01106 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>8<\/b><\/li><li><span>Length (aa)<\/span><b>454<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 22, "nom": "NRAS", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>NRAS<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/zi/6zio/6zio_assembly-1.jpeg\" alt=\"NRAS\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 6ZIO · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Signal transducer in the Ras-MAPK signaling pathway that regulates cell proliferation and survival (PubMed:30712867). Ras proteins bind GDP/GTP and possess intrinsic GTPase activity (PubMed:30712867). Recognized by LZTR1 that mediates its ubiquitination by a BCR (BTB-CUL3-RBX1) E3 ubiquitin-protein ligase complex (PubMed:40934300)<\/p><p class=\"font\">Source: UniProt P01111 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>1<\/b><\/li><li><span>Length (aa)<\/span><b>189<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 37, "nom": "PDCD1", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "immunotherapy"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>PDCD1<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/wt/5wt9/5wt9_assembly-1.jpeg\" alt=\"PDCD1\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 5WT9 · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Inhibitory receptor on antigen activated T-cells that plays a critical role in induction and maintenance of immune tolerance to self (PubMed:21276005, PubMed:31754127, PubMed:32184441, PubMed:37208329). Delivers inhibitory signals upon binding to ligands CD274/PDCD1L1 and CD273/PDCD1LG2 (PubMed:21276005, PubMed:26602187). Following T-cell receptor (TCR) engagement, PDCD1 associates with TCR-CD3 in the immunological synapse and directly inhibits T-cell activation (PubMed:32184441). Suppresses T-cell activation through the recruitment of PTPN11/SHP-2: following ligand-binding, PDCD1 is phosphorylated within the ITSM motif, leading to the recruitment of the protein tyrosine phosphatase PTPN11/SHP-2 that mediates dephosphorylation of key TCR proximal signaling molecules, such as ZAP70, PRKCQ/PKCtheta and CD247/CD3zeta (PubMed:32184441)<\/p><p class=\"font\">Source: UniProt Q15116 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>2<\/b><\/li><li><span>Length (aa)<\/span><b>288<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 24, "nom": "PIK3CA", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>PIK3CA<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/jp/4jps/4jps_assembly-1.jpeg\" alt=\"PIK3CA\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 4JPS · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Phosphoinositide-3-kinase (PI3K) phosphorylates phosphatidylinositol (PI) and its phosphorylated derivatives at position 3 of the inositol ring to produce 3-phosphoinositides (PubMed:15135396, PubMed:23936502, PubMed:28676499). Uses ATP and PtdIns(4,5)P2 (phosphatidylinositol 4,5-bisphosphate) to generate phosphatidylinositol 3,4,5-trisphosphate (PIP3) (PubMed:15135396, PubMed:28676499). PIP3 plays a key role by recruiting PH domain-containing proteins to the membrane, including AKT1 and PDPK1, activating signaling cascades involved in cell growth, survival, proliferation, motility and morphology. Participates in cellular signaling in response to various growth factors. Involved in the activation of AKT1 upon stimulation by receptor tyrosine kinases ligands such as EGF, insulin, IGF1, VEGFA and PDGF. Involved in signaling via insulin-receptor substrate (IRS) proteins. Essential in endothelial cell migration during vascular development through VEGFA signaling, possibly by regulating RhoA activity. Required for lymphatic vasculature development, possibly by binding to RAS and by activation by EGF and FGF2, but not by PDGF. Regulates invadopodia formation through the PDPK1-AKT1 pathway. Participates in cardiomyogenesis in embryonic stem cells through a AKT1 pathway. Participates in vasculogenesis in embryonic stem cells through PDK1 and protein kinase C pathway. In addition to its lipid kinase activity, it displays a serine-protein kinase activity that results in the autophosphorylation of the p85alpha regulatory subunit as well as phosphorylation of other proteins such as 4EBP1, H-Ras, the IL-3 beta c receptor and possibly others (PubMed:23936502, PubMed:28676499). Plays a role in the positive regulation of phagocytosis and pinocytosis (By similarity)<\/p><p class=\"font\">Source: UniProt P42336 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>3<\/b><\/li><li><span>Length (aa)<\/span><b>1068<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 14, "nom": "PTEN", "cat": "Gene / protein", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "suppressors"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>PTEN<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/jv/7jvx/7jvx_assembly-1.jpeg\" alt=\"PTEN\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 7JVX · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Dual-specificity protein phosphatase, dephosphorylating tyrosine-, serine- and threonine-phosphorylated proteins (PubMed:9187108, PubMed:9256433, PubMed:9616126). Also functions as a lipid phosphatase, removing the phosphate in the D3 position of the inositol ring of PtdIns(3,4,5)P3/phosphatidylinositol 3,4,5-trisphosphate, PtdIns(3,4)P2/phosphatidylinositol 3,4-diphosphate and PtdIns3P/phosphatidylinositol 3-phosphate with a preference for PtdIns(3,4,5)P3 (PubMed:16824732, PubMed:26504226, PubMed:9593664, PubMed:9811831). Furthermore, this enzyme can also act as a cytosolic inositol 3-phosphatase acting on Ins(1,3,4,5,6)P5/inositol 1,3,4,5,6 pentakisphosphate and possibly Ins(1,3,4,5)P4/1D-myo-inositol 1,3,4,5-tetrakisphosphate (PubMed:11418101, PubMed:15979280). Antagonizes the PI3K-AKT/PKB signaling pathway by dephosphorylating phosphoinositides and thereby modulating cell cycle progression and cell survival (PubMed:31492966, PubMed:37279284). The unphosphorylated form cooperates with MAGI2 to suppress AKT1 activation (PubMed:11707428). In motile cells, suppresses the formation of lateral pseudopods and thereby promotes cell polarization and directed movement (PubMed:22279049). Dephosphorylates tyrosine-phosphorylated focal adhesion kinase and inhibits cell migration and integrin-mediated cell spreading and focal adhesion formation (PubMed:22279049). Required for growth factor-induced epithelial cell migration; growth factor stimulation induces PTEN phosphorylation which changes its binding preference from the p85 regulatory subunit of the PI3K kinase complex to DLC1 and results in translocation of the PTEN-DLC1 complex to the posterior of migrating cells to promote RHOA activation (PubMed:26166433). Meanwhile, TNS3 switches binding preference from DLC1 to p85 and the TNS3-p85 complex translocates to the leading edge of migrating cells to activate RAC1 activation (PubMed:26166433). Plays a role as a key modulator of the AKT-mTOR signaling pathway controlling the tempo of the process of newborn neurons integration during adult neurogenesis, including correct neuron positioning, dendritic development and synapse formation (By similarity). Involved in the regulation of synaptic function in excitatory hippocampal synapses. Recruited to the postsynaptic membrane upon NMDA receptor activation, is required for the modulation of synaptic activity during plasticity. Enhancement of lipid phosphatase activity is able to drive depression of AMPA receptor-mediated synaptic responses, activity required for NMDA receptor-dependent long-term depression (LTD) (By similarity). May be a negative regulator of insulin signaling and glucose metabolism in adipose tissue. The nuclear monoubiquitinated form possesses greater apoptotic potential, whereas the cytoplasmic nonubiquitinated form induces less tumor suppressive ability (PubMed:10468583, PubMed:18716620)<\/p><p class=\"font\">Source: UniProt P60484 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>10<\/b><\/li><li><span>Length (aa)<\/span><b>403<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 15, "nom": "RB1", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "suppressors"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>RB1<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/el/4elj/4elj_assembly-1.jpeg\" alt=\"RB1\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 4ELJ · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Tumor suppressor that is a key regulator of the G1/S transition of the cell cycle (PubMed:10499802). The hypophosphorylated form binds transcription regulators of the E2F family, preventing transcription of E2F-responsive genes (PubMed:10499802). Both physically blocks E2Fs transactivating domain and recruits chromatin-modifying enzymes that actively repress transcription (PubMed:10499802). Cyclin and CDK-dependent phosphorylation of RB1 induces its dissociation from E2Fs, thereby activating transcription of E2F responsive genes and triggering entry into S phase (PubMed:10499802). RB1 also promotes the G0-G1 transition upon phosphorylation and activation by CDK3/cyclin-C (PubMed:15084261). Directly involved in heterochromatin formation by maintaining overall chromatin structure and, in particular, that of constitutive heterochromatin by stabilizing histone methylation. Recruits and targets histone methyltransferases SUV39H1, KMT5B and KMT5C, leading to epigenetic transcriptional repression. Controls histone H4 &#x27;Lys-20&#x27; trimethylation. Inhibits the intrinsic kinase activity of TAF1. Mediates transcriptional repression by SMARCA4/BRG1 by recruiting a histone deacetylase (HDAC) complex to the c-FOS promoter. In resting neurons, transcription of the c-FOS promoter is inhibited by BRG1-dependent recruitment of a phospho-RB1-HDAC1 repressor complex. Upon calcium influx, RB1 is dephosphorylated by calcineurin, which leads to release of the repressor complex (By similarity)<\/p><p class=\"font\">Source: UniProt P06400 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>13<\/b><\/li><li><span>Length (aa)<\/span><b>928<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 29, "nom": "SRC", "cat": "Gene / protein", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>SRC<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/jn/8jn8/8jn8_assembly-1.jpeg\" alt=\"SRC\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 8JN8 · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Non-receptor protein tyrosine kinase which is activated following engagement of many different classes of cellular receptors including immune response receptors, integrins and other adhesion receptors, receptor protein tyrosine kinases, G protein-coupled receptors as well as cytokine receptors (PubMed:34234773). Participates in signaling pathways that control a diverse spectrum of biological activities including gene transcription, immune response, cell adhesion, cell cycle progression, apoptosis, migration, and transformation. Due to functional redundancy between members of the SRC kinase family, identification of the specific role of each SRC kinase is very difficult. SRC appears to be one of the primary kinases activated following engagement of receptors and plays a role in the activation of other protein tyrosine kinase (PTK) families. Receptor clustering or dimerization leads to recruitment of SRC to the receptor complexes where it phosphorylates the tyrosine residues within the receptor cytoplasmic domains. Plays an important role in the regulation of cytoskeletal organization through phosphorylation of specific substrates such as AFAP1. Phosphorylation of AFAP1 allows the SRC SH2 domain to bind AFAP1 and to localize to actin filaments. Cytoskeletal reorganization is also controlled through the phosphorylation of cortactin (CTTN) (Probable). When cells adhere via focal adhesions to the extracellular matrix, signals are transmitted by integrins into the cell resulting in tyrosine phosphorylation of a number of focal adhesion proteins, including PTK2/FAK1 and paxillin (PXN) (PubMed:21411625). In addition to phosphorylating focal adhesion proteins, SRC is also active at the sites of cell-cell contact adherens junctions and phosphorylates substrates such as beta-catenin (CTNNB1), delta-catenin (CTNND1), and plakoglobin (JUP). Another type of cell-cell junction, the gap junction, is also a target for SRC, which phosphorylates connexin-43 (GJA1). SRC is implicated in regulation of pre-mRNA-processing and phosphorylates RNA-binding proteins such as KHDRBS1 (Probable). Phosphorylates PKP3 at &#x27;Tyr-195&#x27; in response to reactive oxygen species, which may cause the release of PKP3 from desmosome cell junctions into the cytoplasm (PubMed:25501895). Also plays a role in PDGF-mediated tyrosine phosphorylation of both STAT1 and STAT3, leading to increased DNA binding activity of these transcription factors (By similarity). Involved in the RAS pathway through phosphorylation of RASA1 and RASGRF1 (PubMed:11389730). Plays a role in EGF-mediated calcium-activated chloride channel activation (PubMed:18586953). Required for epidermal growth factor receptor (EGFR) internalization through phosphorylation of clathrin heavy chain (CLTC and CLTCL1) at &#x27;Tyr-1477&#x27;. Involved in beta-arrestin (ARRB1 and ARRB2) desensitization through phosphorylation and activation of GRK2, leading to beta-arrestin phosphorylation and internalization. Has a critical role in the stimulation of the CDK20/MAPK3 mitogen-activated protein kinase cascade by epidermal growth factor (Probable). Might be involved not only in mediating the transduction of mitogenic signals at the level of the plasma membrane but also in controlling progression through the cell cycle via interaction with regulatory proteins in the nucleus (PubMed:7853507). Plays an important role in osteoclastic bone resorption in conjunction with PTK2B/PYK2. Both the formation of a SRC-PTK2B/PYK2 complex and SRC kinase activity are necessary for this function. Recruited to activated integrins by PTK2B/PYK2, thereby phosphorylating CBL, which in turn induces the activation and recruitment of phosphatidylinositol 3-kinase to the cell membrane in a signaling pathway that is critical for osteoclast function (PubMed:14585963, PubMed:8755529). Upon activation of the G(q)-dependent KISS1/KISS1R signaling pathway, active SRC is recruited, together with the phosphatase DUSP18, to the KISS1R C-terminus (PubMed:38346942). This leads to DUSP18-mediated SRC dephosphorylation and inactivation, down-regulation of osteoclast differentiation and activity, and consequently suppression of bone resorption (By similarity). Promotes energy production in osteoclasts by activating mitochondrial cytochrome C oxidase (PubMed:12615910). Phosphorylates DDR2 on tyrosine residues, thereby promoting its subsequent autophosphorylation (PubMed:16186108). Phosphorylates RUNX3 and COX2 on tyrosine residues, TNK2 on &#x27;Tyr-284&#x27; and CBL on &#x27;Tyr-731&#x27; (PubMed:20100835, PubMed:21309750). Enhances RIGI-elicited antiviral signaling (PubMed:19419966). Phosphorylates PDPK1 at &#x27;Tyr-9&#x27;, &#x27;Tyr-373&#x27; and &#x27;Tyr-376&#x27; (PubMed:14585963). Phosphorylates BCAR1 at &#x27;Tyr-128&#x27; (PubMed:22710723). Phosphorylates CBLC at multiple tyrosine residues, phosphorylation at &#x27;Tyr-341&#x27; activates CBLC E3 activity (PubMed:20525694). Phosphorylates synaptic vesicle protein synaptophysin (SYP) (By similarity). Involved in anchorage-independent cell growth (PubMed:19307596). Required for podosome formation (By similarity). Mediates IL6 signaling by activating YAP1-NOTCH pathway to induce inflammation-induced epithelial regeneration (PubMed:25731159). Phosphorylates OTUB1, promoting deubiquitination of RPTOR (PubMed:35927303). Phosphorylates caspase CASP8 at &#x27;Tyr-380&#x27; which negatively regulates CASP8 processing and activation, down-regulating CASP8 proapoptotic function (PubMed:16619028). Mediates laminin-induced activation of RAC1 signaling through phosphorylation of syntrophin (By similarity)<\/p><p class=\"font\">Source: UniProt P12931 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>20<\/b><\/li><li><span>Length (aa)<\/span><b>536<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 1, "nom": "TP53", "cat": "Gene / protein", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "suppressors"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>TP53<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/r2/9r2q/9r2q_assembly-1.jpeg\" alt=\"TP53\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 9R2Q · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Multifunctional transcription factor that induces cell cycle arrest, DNA repair or apoptosis upon binding to its target DNA sequence (PubMed:11025664, PubMed:12524540, PubMed:12810724, PubMed:15186775, PubMed:15340061, PubMed:17317671, PubMed:17349958, PubMed:19556538, PubMed:20673990, PubMed:20959462, PubMed:22726440, PubMed:24051492, PubMed:24652652, PubMed:35618207, PubMed:36634798, PubMed:38653238, PubMed:9840937). Acts as a tumor suppressor in many tumor types; induces growth arrest or apoptosis depending on the physiological circumstances and cell type (PubMed:11025664, PubMed:12524540, PubMed:12810724, PubMed:15186775, PubMed:15340061, PubMed:17189187, PubMed:17317671, PubMed:17349958, PubMed:19556538, PubMed:20673990, PubMed:20959462, PubMed:22726440, PubMed:24051492, PubMed:24652652, PubMed:38653238, PubMed:9840937). Negatively regulates cell division by controlling expression of a set of genes required for this process (PubMed:11025664, PubMed:12524540, PubMed:12810724, PubMed:15186775, PubMed:15340061, PubMed:17317671, PubMed:17349958, PubMed:19556538, PubMed:20673990, PubMed:20959462, PubMed:22726440, PubMed:24051492, PubMed:24652652, PubMed:9840937). One of the activated genes is an inhibitor of cyclin-dependent kinases. Apoptosis induction seems to be mediated either by stimulation of BAX and FAS antigen expression, or by repression of Bcl-2 expression (PubMed:12524540, PubMed:17189187). Its pro-apoptotic activity is activated via its interaction with PPP1R13B/ASPP1 or TP53BP2/ASPP2 (PubMed:12524540). However, this activity is inhibited when the interaction with PPP1R13B/ASPP1 or TP53BP2/ASPP2 is displaced by PPP1R13L/iASPP (PubMed:12524540). In cooperation with mitochondrial PPIF is involved in activating oxidative stress-induced necrosis; the function is largely independent of transcription. Induces the transcription of long intergenic non-coding RNA p21 (lincRNA-p21) and lincRNA-Mkln1. LincRNA-p21 participates in TP53-dependent transcriptional repression leading to apoptosis and seems to have an effect on cell-cycle regulation. Implicated in Notch signaling cross-over. Prevents CDK7 kinase activity when associated to CAK complex in response to DNA damage, thus stopping cell cycle progression. Isoform 2 enhances the transactivation activity of isoform 1 from some but not all TP53-inducible promoters. Isoform 4 suppresses transactivation activity and impairs growth suppression mediated by isoform 1. Isoform 7 inhibits isoform 1-mediated apoptosis. Regulates the circadian clock by repressing CLOCK-BMAL1-mediated transcriptional activation of PER2 (PubMed:24051492)<\/p><p class=\"font\">Source: UniProt P04637 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>17<\/b><\/li><li><span>Length (aa)<\/span><b>393<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 18, "nom": "VHL", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "suppressors"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>VHL<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/qv/8qvu/8qvu_assembly-1.jpeg\" alt=\"VHL\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 8QVU · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Involved in the ubiquitination and subsequent proteasomal degradation via the von Hippel-Lindau ubiquitination complex (PubMed:10944113, PubMed:17981124, PubMed:19584355). Seems to act as a target recruitment subunit in the E3 ubiquitin ligase complex and recruits hydroxylated hypoxia-inducible factor (HIF) under normoxic conditions (PubMed:10944113, PubMed:17981124). Involved in transcriptional repression through interaction with HIF1A, HIF1AN and histone deacetylases (PubMed:10944113, PubMed:17981124). Ubiquitinates, in an oxygen-responsive manner, ADRB2 (PubMed:19584355). Acts as a negative regulator of mTORC1 by promoting ubiquitination and degradation of RPTOR (PubMed:34290272)<\/p><p class=\"font\">Source: UniProt P40337 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>3<\/b><\/li><li><span>Length (aa)<\/span><b>213<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 88, "nom": "A549", "cat": "Cell line", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "cell-lines"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>A549<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/Intercellular_connections_in_a549_cells.jpg/960px-Intercellular_connections_in_a549_cells.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"A549\" loading=\"lazy\"><div class=\"cred\">John Riemann Soong at en.wikipedia · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Cell line<\/div><p class=\"def\">A549 cells are adenocarcinomic human alveolar basal epithelial cells, and constitute a cell line that was first developed in 1972 by D. J. Giard, et al. through the removal and culturing of cancerous lung tissue in the explanted tumor of a 58-year-old caucasian male. The cells are used as models for the study of lung cancer and the development of drug therapies against it.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;A549 cell&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"46\" cy=\"46\" r=\"14\" fill=\"currentColor\" opacity=\".8\"/><circle cx=\"70\" cy=\"62\" r=\"4\" fill=\"currentColor\"/><circle cx=\"30\" cy=\"66\" r=\"3\" fill=\"currentColor\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"currentColor\"/>"}, {"id": 93, "nom": "HCT116", "cat": "Cell line", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "cell-lines"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>HCT116<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/3/39/Telomeres_01.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"HCT116\" loading=\"lazy\"><div class=\"cred\">Asako J. Nakamura, Christophe E. Redon, William M. Bonner, and Olga A. Sedelnikova · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Cell line<\/div><p class=\"def\">HCT116 is a human colon cancer cell line used in therapeutic research and drug screenings.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;HCT116 cells&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"46\" cy=\"46\" r=\"14\" fill=\"currentColor\" opacity=\".8\"/><circle cx=\"70\" cy=\"62\" r=\"4\" fill=\"currentColor\"/><circle cx=\"30\" cy=\"66\" r=\"3\" fill=\"currentColor\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"currentColor\"/>"}, {"id": 89, "nom": "HEK293", "cat": "Cell line", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "cell-lines"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>HEK293<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6e/HEK_293.jpg/960px-HEK_293.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"HEK293\" loading=\"lazy\"><div class=\"cred\">Iznewton · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Cell line<\/div><p class=\"def\">Human embryonic kidney 293 cells, also often referred to as HEK 293, HEK-293, 293 cells, are an immortalised cell line derived from HEK cells isolated from a female fetus in the 1970s.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;HEK 293 cells&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"46\" cy=\"46\" r=\"14\" fill=\"currentColor\" opacity=\".8\"/><circle cx=\"70\" cy=\"62\" r=\"4\" fill=\"currentColor\"/><circle cx=\"30\" cy=\"66\" r=\"3\" fill=\"currentColor\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"currentColor\"/>"}, {"id": 11, "nom": "HeLa", "cat": "Cell line", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": ["cancer", "cell-lines"], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>HeLa<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d2/HeLa-IV.jpg/960px-HeLa-IV.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"HeLa\" loading=\"lazy\"><div class=\"cred\">National Institutes of Health (NIH) · Public domain<\/div><\/div><div class=\"cat\">Cell line<\/div><p class=\"def\">HeLa is an immortalized cell line used in scientific research. It is the oldest human cell line and one of the most commonly used. HeLa cells are durable and prolific, allowing for extensive applications in scientific study. The line is derived from cervical cancer cells taken without consent on February 8, 1951, from Henrietta Lacks, a 31-year-old African-American woman, after whom the line is named. Lacks died of cancer on October 4, 1951.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;HeLa&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"46\" cy=\"46\" r=\"14\" fill=\"currentColor\" opacity=\".8\"/><circle cx=\"70\" cy=\"62\" r=\"4\" fill=\"currentColor\"/><circle cx=\"30\" cy=\"66\" r=\"3\" fill=\"currentColor\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"currentColor\"/>"}, {"id": 90, "nom": "Jurkat", "cat": "Cell line", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "cell-lines"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Jurkat<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/89/NFDI4BIOIMAGE_Calendar_September_2025.png/960px-NFDI4BIOIMAGE_Calendar_September_2025.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Jurkat\" loading=\"lazy\"><div class=\"cred\">Faber-Zuschratter, Heidi; Stöter, Torsten; Zuschratter, Werner (ORCID: 0000-0002-9845-6393); Hartig, Roland (ORCID: 0000-0002-3706-7458); Wilke, Markus · CC BY 4.0<\/div><\/div><div class=\"cat\">Cell line<\/div><p class=\"def\">Jurkat cells are an immortalized line of human T lymphocyte cells that are used to study acute T cell leukemia, T cell signaling, and the expression of various chemokine receptors susceptible to viral entry, particularly HIV. Jurkat cells can, upon stimulation by phytohaemagglutinin (PHA) or other stimulants such as phorbol 12-myristate 13-acetate, express interleukin 2, and are used in research involving the susceptibility of cancers to drugs and radiation. However in the general case chronic phytohaemagglutinin kills Jurkat cells, though Jurkat clones can be devised which resist PHA-induced killing. The object of the system is that Jurkat cells can react to a signal and their expression can be measured. Jurkat cells with elements missing or knocked out can then provide a basis for examining the importance of that element on the expression of interleukin 2.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Jurkat cells&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"46\" cy=\"46\" r=\"14\" fill=\"currentColor\" opacity=\".8\"/><circle cx=\"70\" cy=\"62\" r=\"4\" fill=\"currentColor\"/><circle cx=\"30\" cy=\"66\" r=\"3\" fill=\"currentColor\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"currentColor\"/>"}, {"id": 91, "nom": "K562", "cat": "Cell line", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "cell-lines"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>K562<\/h2><span>Common<\/span><\/header><div class=\"img\"><div class=\"sense-img\"><svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"46\" cy=\"46\" r=\"14\" fill=\"currentColor\" opacity=\".8\"/><circle cx=\"70\" cy=\"62\" r=\"4\" fill=\"currentColor\"/><circle cx=\"30\" cy=\"66\" r=\"3\" fill=\"currentColor\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"currentColor\"/><\/svg><span>Cell line<\/span><\/div><\/div><div class=\"cat\">Cell line<\/div><p class=\"def\">K562 cells were the first human immortalised myelogenous leukemia cell line to be established. K562 cells are of the erythroleukemia type, and the cell line is derived from a 53-year-old female chronic myelogenous leukemia patient in blast crisis. The cells are non-adherent and rounded, are positive for the bcr:abl fusion gene, and bear some proteomic resemblance to both undifferentiated granulocytes and erythrocytes.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;K562 cells&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"46\" cy=\"46\" r=\"14\" fill=\"currentColor\" opacity=\".8\"/><circle cx=\"70\" cy=\"62\" r=\"4\" fill=\"currentColor\"/><circle cx=\"30\" cy=\"66\" r=\"3\" fill=\"currentColor\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"currentColor\"/>"}, {"id": 87, "nom": "MCF-7", "cat": "Cell line", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "cell-lines"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>MCF-7<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9f/MCF-7_Cells.jpg/960px-MCF-7_Cells.jpg?utm_source=commons.wikimedia.org&amp;utm_campaig
