<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIO Cards</title><style>body{margin:0;font:15px system-ui,sans-serif;background:#10141b;color:#e8ecf2}
h1{padding:20px 16px 0;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;padding:16px}
.carta{background:#1a212c;border:3px solid var(--r);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}h2{margin:0;font-size:18px}
header span{color:var(--r);font-size:12px;font-weight:700;text-transform:uppercase}
.img{height:160px;background:#0c1016;border-radius:8px;overflow:hidden;position:relative;display:flex}
.img img{width:100%;height:100%;object-fit:contain}.cred{position:absolute;bottom:0;left:0;right:0;font-size:10px;
background:#000a;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sense-img{margin:auto;color:var(--r);display:flex;flex-direction:column;align-items:center;gap:4px;opacity:.9}.sense-img svg{width:96px;height:96px}.sense-img span{font-size:11px;color:#6b7686}.cat{font-size:12px;color:#9aa6b6}.def{margin:0;font-size:13px;line-height:1.4;
display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.def.buit{color:#6b7686;font-style:italic}
.font{margin:0;font-size:10px;color:#6b7686}.stats{list-style:none;margin:0;padding:0;display:flex;gap:12px;font-size:12px}
.stats span{color:#9aa6b6;margin-right:4px}
header.top{position:sticky;top:0;z-index:5;background:#10141bee;backdrop-filter:blur(6px);display:flex;gap:12px;
align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #263041}
header.top h1{padding:0;font-size:20px}.coins{margin-left:auto;font-weight:700;color:#f0c34a}
nav button,.btn{background:#1f2a3a;color:#e8ecf2;border:1px solid #33425a;border-radius:8px;padding:8px 12px;cursor:pointer;font:inherit}
nav button.on,.btn.pri{background:#2f7fd1;border-color:#2f7fd1}.btn:disabled{opacity:.4;cursor:not-allowed}
main{padding:16px;max-width:1200px;margin:auto}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 16px}
select{background:#1f2a3a;color:#e8ecf2;border:1px solid #33425a;border-radius:8px;padding:8px}
.slot{display:flex;flex-direction:column;gap:6px}.slot .carta{height:100%}.slot.new .carta{box-shadow:0 0 18px var(--r)}
.badge{align-self:flex-start;font-size:11px;font-weight:700;background:#e0a21a;color:#111;border-radius:6px;padding:1px 6px}
.cnt{font-size:12px;color:#9aa6b6}.ghost{opacity:.45;filter:grayscale(.8)}.ghost .sense-img span{font-size:12px}
.pack{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.reveal .slot{animation:in .5s both}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.96)}}
.mis{background:#1a212c;border:1px solid #263041;border-radius:12px;padding:12px;margin-bottom:10px;display:flex;gap:12px;
align-items:center;flex-wrap:wrap}.mis h3{margin:0;font-size:16px}.mis p{margin:2px 0;color:#9aa6b6;font-size:13px}.mis .info{flex:1;min-width:220px}
.bar{height:6px;background:#0c1016;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:#3f9b5c}
.done{color:#3f9b5c;font-weight:700}textarea{width:100%;height:90px;background:#0c1016;color:#e8ecf2;border:1px solid #33425a;border-radius:8px}

</style><header class="top"><h1>BIO Cards</h1><nav><button data-v="packs">Packs</button> <button data-v="coll">Collection</button> <button data-v="mis">Missions</button> <button data-v="save">Save</button></nav><span class="coins" id="coins"></span></header><main id="app"></main><script id="dades" type="application/json">{"cartes": [{"id": 52, "nom": "Autoclave", "cat": "Instrument", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Autoclave<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/e/eb/Rectangular-medical-autoclave-cutaway.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Autoclave\" loading=\"lazy\"><div class=\"cred\">Priorclave North America · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">An autoclave is a machine used to carry out industrial and scientific processes requiring elevated temperature and pressure in relation to ambient pressure and temperature. Autoclaves are found in many medical settings, laboratories, and other places that need to ensure the sterility of an object.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Autoclave&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 57, "nom": "Biosafety cabinet", "cat": "Instrument", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Biosafety cabinet<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/86/Influenza_virus_research.jpg/960px-Influenza_virus_research.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Biosafety cabinet\" loading=\"lazy\"><div class=\"cred\">Photo Credit: James Gathany\nContent Providers(s): CDC · Public domain<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">A biosafety cabinet (BSC)—also called a biological safety cabinet or microbiological safety cabinet—is an enclosed, ventilated laboratory workspace for safely working with materials contaminated with pathogens requiring a defined biosafety level. Several different types of BSC exist, differentiated by the degree of biocontainment they provide. BSCs first became commercially available in 1950.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Biosafety cabinet&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 51, "nom": "Centrifuge", "cat": "Instrument", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Centrifuge<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0d/Tabletop_centrifuge.jpg/960px-Tabletop_centrifuge.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Centrifuge\" loading=\"lazy\"><div class=\"cred\">Magnus Manske · CC BY 1.0<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">A centrifuge is a device that uses centrifugal force to subject a specimen to a specified constant force – for example, to separate various components of a fluid. This is achieved by spinning the fluid at high speed within a container, thereby separating fluids of different densities or liquids from solids. It works by causing denser substances and particles to move outward in the radial direction. At the same time, objects that are less dense are displaced and moved to the centre. In a laboratory centrifuge that uses sample tubes, the radial acceleration causes denser particles to settle to the bottom of the tube, while low-density substances rise to the top. A centrifuge can be a very effective filter that separates contaminants from the main body of fluid.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Centrifuge&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 55, "nom": "Electron microscope", "cat": "Instrument", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": [], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>Electron microscope<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/17/TITAN.jpg/960px-TITAN.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Electron microscope\" loading=\"lazy\"><div class=\"cred\">Alice im Miniland · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">An electron microscope is a microscope that uses a beam of electrons as a source of &quot;illumination&quot;. It uses electron optics that are analogous to the glass lenses of an optical light microscope to control the electron beam, for instance focusing it to produce magnified images or electron diffraction patterns. As the wavelength of an electron can be more than 100,000 times smaller than that of visible light, electron microscopes have a much higher resolution of about 0.1 nm, which compares to about 200 nm for light microscopes. Electron microscope may refer to:Transmission electron microscope (TEM) where swift electrons go through a thin sample\nScanning transmission electron microscope (STEM) which is similar to TEM with a scanned electron probe\nScanning electron microscope (SEM) which is similar to STEM, but with thick samples\nElectron microprobe similar to a SEM, but more for chemical analysis\nLow-energy electron microscope (LEEM), used to image surfaces\nPhotoemission electron microscope (PEEM) which is similar to LEEM using electrons emitted from surfaces by photons<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Electron microscope&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 59, "nom": "Hemocytometer", "cat": "Instrument", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Hemocytometer<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/18/Hemocytometer_with_gloved_hand.JPG/960px-Hemocytometer_with_gloved_hand.JPG?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Hemocytometer\" loading=\"lazy\"><div class=\"cred\">Jeffrey M. Vinocur · CC BY 2.5<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">The hemocytometer is a counting-chamber device originally designed and usually used for counting blood cells.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Hemocytometer&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 60, "nom": "Magnetic stirrer", "cat": "Instrument", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Magnetic stirrer<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Magnetic_Stirrer.JPG/960px-Magnetic_Stirrer.JPG?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Magnetic stirrer\" loading=\"lazy\"><div class=\"cred\">User:Ruhrfisch · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">A magnetic stirrer or magnetic mixer is a laboratory device that employs a rotating magnetic field to cause a stir bar immersed in a liquid to spin very quickly, thus stirring it. The rotating field may be created either by a rotating magnet or a set of stationary electromagnets, placed beneath the vessel with the liquid. It is used in chemistry and biology as a convenient way to stir small volumes and where other forms of stirring, such as overhead stirrers and stirring rods, may not be viable.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Magnetic stirrer&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 56, "nom": "Mass spectrometer", "cat": "Instrument", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Mass spectrometer<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Discovery_of_neon_isotopes.JPG/960px-Discovery_of_neon_isotopes.JPG?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Mass spectrometer\" loading=\"lazy\"><div class=\"cred\">Francis William Aston · Public domain<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">\nMass spectrometry (MS) is an analytical technique that is used to measure the mass-to-charge ratio of ions. The results are presented as a mass spectrum, a plot of intensity as a function of the mass-to-charge ratio. These spectra are used to determine the elemental or isotopic signature of a sample, the masses of particles and of molecules, and to elucidate the chemical identity or structure of molecules and other chemical compounds. Mass spectrometry is used in many different fields and is applied to pure samples as well as complex mixtures.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Mass spectrometry&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 58, "nom": "Microplate reader", "cat": "Instrument", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Microplate reader<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/67/Microplate_reader.jpg/960px-Microplate_reader.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Microplate reader\" loading=\"lazy\"><div class=\"cred\">Pdcook · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">Plate readers, also known as microplate readers or microplate photometers, are instruments which are used to detect biological, chemical or physical events of samples in microtiter plates. They are widely used in research, drug discovery, bioassay validation, quality control and manufacturing processes in the pharmaceutical and biotechnological industry and academic organizations. Sample reactions can be assayed in 1-1536 well format microtiter plates. The most common microplate format used in academic research laboratories or clinical diagnostic laboratories is 96-well with a typical reaction volume between 100 and 200 μL per well. Higher density microplates are typically used for screening applications, when throughput and assay cost per sample become critical parameters, with a typical assay volume between 5 and 50 μL per well. Common detection modes for microplate assays are absorbance, fluorescence intensity, luminescence, time-resolved fluorescence, and fluorescence polarization.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Plate reader&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 9, "nom": "Microscope", "cat": "Instrument", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": [], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>Microscope<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b7/Ukrainian_microscope_%28cropped%29.jpg/960px-Ukrainian_microscope_%28cropped%29.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Microscope\" loading=\"lazy\"><div class=\"cred\">Ann 2000 · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">A microscope is a laboratory instrument used to examine objects that are too small to be seen by the naked eye. Microscopy is the science of investigating small objects and structures using a microscope. Microscopic means being invisible to the eye unless aided by a microscope.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Microscope&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 53, "nom": "Pipette", "cat": "Instrument", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Pipette<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/Pipette_gallery.jpg/960px-Pipette_gallery.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Pipette\" loading=\"lazy\"><div class=\"cred\">User:Squidonius, myself, and User:Beliason (assumed). · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">A pipette, or pipet, is a type of laboratory tool commonly used in chemistry and biology to transport a measured volume of liquid, often as a media dispenser. Pipettes come in several designs for various purposes with differing levels of accuracy and precision, from single piece glass pipettes to more complex adjustable or electronic pipettes. Many pipette types work by creating a partial vacuum above the liquid-holding chamber and selectively releasing this vacuum to draw up and dispense liquid. Measurement accuracy varies greatly depending on the instrument.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Pipette&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 54, "nom": "Spectrophotometer", "cat": "Instrument", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Spectrophotometer<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/10/Spektrofotometri.jpg/960px-Spektrofotometri.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Spectrophotometer\" loading=\"lazy\"><div class=\"cred\">Skorpion87 · Public domain<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">Spectrophotometry is a branch of electromagnetic spectroscopy concerned with the quantitative measurement of the reflection or transmission properties of a material as a function of wavelength. Spectrophotometry uses photometers, known as spectrophotometers, that can measure the intensity of a light beam at different wavelengths. Although spectrophotometry is most commonly applied to ultraviolet, visible, and infrared radiation, modern spectrophotometers can interrogate wide swaths of the electromagnetic spectrum, including x-ray, ultraviolet, visible, infrared, or microwave wavelengths.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Spectrophotometry&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 8, "nom": "Thermal cycler", "cat": "Instrument", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Thermal cycler<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a5/Eppendorf_Mastercycler_Pro_S.jpg/960px-Eppendorf_Mastercycler_Pro_S.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Thermal cycler\" loading=\"lazy\"><div class=\"cred\">GFJ · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Instrument<\/div><p class=\"def\">The thermal cycler is a laboratory apparatus most commonly used to amplify segments of DNA via the polymerase chain reaction (PCR). Thermal cyclers may also be used in laboratories to facilitate other temperature-sensitive reactions, including restriction enzyme digestion or rapid diagnostics. The device has a thermal block with holes where tubes holding the reaction mixtures can be inserted. The cycler then raises and lowers the temperature of the block in discrete, pre-programmed steps.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Thermal cycler&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"50\" r=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M50 10v16M50 74v16M10 50h16M74 50h16M22 22l11 11M67 67l11 11M78 22L67 33M33 67L22 78\" stroke=\"currentColor\" stroke-width=\"6\" stroke-linecap=\"round\"/>"}, {"id": 76, "nom": "Barbara McClintock", "cat": "Scientist", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["nobel"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Barbara McClintock<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/14/Barbara_McClintock_%281902-1992%29_shown_in_her_laboratory_in_1947.jpg/960px-Barbara_McClintock_%281902-1992%29_shown_in_her_laboratory_in_1947.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Barbara McClintock\" loading=\"lazy\"><div class=\"cred\">Smithsonian Institution/Science Service; Restored by Adam Cuerden · Public domain<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Barbara McClintock was an American cytogeneticist who was awarded the 1983 Nobel Prize in Physiology or Medicine. McClintock received her PhD in botany from Cornell University in 1927. There, she started her career as the leader of the development of maize cytogenetics, the focus of her research for the rest of her life. From the late 1920s, McClintock studied chromosomes and how they change during reproduction in maize. She developed the technique for visualizing maize chromosomes and used microscopic analysis to demonstrate many fundamental genetic ideas. One of those ideas was the notion of genetic recombination by crossing-over during meiosis—a mechanism by which chromosomes exchange information. She demonstrated the role of the telomere and centromere, regions of the chromosome that are important in the conservation of genetic information. She was recognized as among the best in the field, awarded prestigious fellowships, and elected a member of the National Academy of Sciences in 1944.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Barbara McClintock&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 69, "nom": "Bert Vogelstein", "cat": "Scientist", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Bert Vogelstein<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/2/23/Bert_Vogelstein_giving_the_Trent_Lecture.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Bert Vogelstein\" loading=\"lazy\"><div class=\"cred\">Raymond MacDougall · Public domain<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Bert Vogelstein is director of the Ludwig Center, Clayton Professor of Oncology and Pathology and a Howard Hughes Medical Institute investigator at The Johns Hopkins Medical School and Sidney Kimmel Comprehensive Cancer Center. Vogelstein is also the co-director of the Ludwig Center at Johns Hopkins. A pioneer in the field of cancer genomics, his studies on colorectal cancers revealed that they result from the sequential accumulation of mutations in oncogenes and tumor suppressor genes. These studies now form the paradigm for modern cancer research and provided the basis for the notion of the somatic evolution of cancer.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Bert Vogelstein&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 71, "nom": "Carol W. Greider", "cat": "Scientist", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["nobel"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Carol W. Greider<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/39/Carol_Greider_by_Chris_Michel_1s946948-11-23.jpg/960px-Carol_Greider_by_Chris_Michel_1s946948-11-23.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Carol W. Greider\" loading=\"lazy\"><div class=\"cred\">Christopher Michel · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Carolyn Widney Greider is an American molecular biologist and Nobel laureate. She is a Distinguished Professor of Molecular, Cell, and Developmental Biology at the University of California, Santa Cruz.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Carol W. Greider&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 70, "nom": "Elizabeth Blackburn", "cat": "Scientist", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["nobel"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Elizabeth Blackburn<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Elizabeth_Blackburn_in_2024_by_Christopher_Michel.jpg/960px-Elizabeth_Blackburn_in_2024_by_Christopher_Michel.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Elizabeth Blackburn\" loading=\"lazy\"><div class=\"cred\">Christopher Michel · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Elizabeth Helen Blackburn is an Australian–American Nobel laureate who is the former president of the Salk Institute for Biological Studies. In 1984, Blackburn co-discovered telomerase, the enzyme that replenishes the telomere, with Carol W. Greider. For this work, she was awarded the 2009 Nobel Prize in Physiology or Medicine, sharing it with Carol W. Greider and Jack W. Szostak, becoming the first Australian woman Nobel laureate.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Elizabeth Blackburn&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 79, "nom": "Emmanuelle Charpentier", "cat": "Scientist", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["nobel"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Emmanuelle Charpentier<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/6/66/Emmanuelle_Charpentier.jpg/960px-Emmanuelle_Charpentier.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Emmanuelle Charpentier\" loading=\"lazy\"><div class=\"cred\">Bianca Fioretti, Hallbauer &amp; Fioretti · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Emmanuelle Marie Charpentier is a French academic, microbiologist, geneticist, and biochemist. She has served as a director at the Max Planck Institute for Infection Biology in Berlin since 2015. Three years later, she founded an independent research institute, the Max Planck Unit for the Science of Pathogens. In 2020, Charpentier and American biochemist Jennifer Doudna of the University of California, Berkeley, were awarded the Nobel Prize in Chemistry &quot;for the development of a method for genome editing&quot;. This was the first science Nobel Prize ever won exclusively by two women.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Emmanuelle Charpentier&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 64, "nom": "Francis Crick", "cat": "Scientist", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": ["nobel"], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>Francis Crick<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/99/Francis_Crick_crop.jpg/960px-Francis_Crick_crop.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Francis Crick\" loading=\"lazy\"><div class=\"cred\">Francis_Crick.png: Photo: Marc Lieberman, per ticket:2015100910022707\nderivative work: Materialscientist (talk) · CC BY 2.5<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Francis Harry Compton Crick was an English molecular biologist, biophysicist, and neuroscientist. He, James Watson, Rosalind Franklin, and Maurice Wilkins played crucial roles in deciphering the helical structure of the DNA molecule.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Francis Crick&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 66, "nom": "Harold Varmus", "cat": "Scientist", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "nobel"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Harold Varmus<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/National_Cancer_Institute_director_Harold_E._Varmus_%283%29_%28cropped%29.jpg/960px-National_Cancer_Institute_director_Harold_E._Varmus_%283%29_%28cropped%29.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Harold Varmus\" loading=\"lazy\"><div class=\"cred\">Matthew Septimus (photographer) · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Harold Eliot Varmus is an American Nobel Prize-winning scientist. He is currently the Lewis Thomas University Professor of Medicine at Weill Cornell Medicine and a senior associate at the New York Genome Center.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Harold E. Varmus&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 10, "nom": "Henrietta Lacks", "cat": "Scientist", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "cell-lines"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Henrietta Lacks<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/0/03/Henrietta_Lacks_%28cropped%29.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Henrietta Lacks\" loading=\"lazy\"><div class=\"cred\">Oregon State University · CC BY-SA 2.0<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Henrietta Lacks was an African-American woman whose cancer cells are the source of the HeLa cell line, the first immortalized human cell line and one of the most important cell lines in medical research. An immortalized cell line reproduces indefinitely under specific conditions, and the HeLa cell line continues to be a source of invaluable medical data and research to the present day.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Henrietta Lacks&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 67, "nom": "J. Michael Bishop", "cat": "Scientist", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "nobel"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>J. Michael Bishop<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Nci-vol-8172-300_j_michael_bishop.jpg/960px-Nci-vol-8172-300_j_michael_bishop.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"J. Michael Bishop\" loading=\"lazy\"><div class=\"cred\">Unknown authorUnknown author · Public domain<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">John Michael Bishop was an American immunologist and microbiologist who shared the 1989 Nobel Prize in Physiology or Medicine with Harold E. Varmus. He was a faculty member at the University of California, San Francisco (UCSF), where he also served as chancellor from 1998 to 2009.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;J. Michael Bishop&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 73, "nom": "James P. Allison", "cat": "Scientist", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "nobel"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>James P. Allison<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/ff/James_P._Allison_EM1B5525_%2846207775441%29.jpg/960px-James_P._Allison_EM1B5525_%2846207775441%29.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"James P. Allison\" loading=\"lazy\"><div class=\"cred\">Bengt Nyman from Vaxholm, Sweden · CC BY 2.0<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">James Patrick Allison is an American immunologist and Nobel laureate who holds the position of professor and chair of immunology and executive director of immunotherapy platform at the MD Anderson Cancer Center in Houston, Texas. Allison is Regental Professor and Founding-Director of James P. Allison Institute at the MD Anderson Cancer Center.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;James P. Allison&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 63, "nom": "James Watson", "cat": "Scientist", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": ["nobel"], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>James Watson<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d8/James_D._Watson_LCCN2007680359.jpg/960px-James_D._Watson_LCCN2007680359.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"James Watson\" loading=\"lazy\"><div class=\"cred\">Newspaper Enterprise Association · Public domain<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">James Dewey Watson was an American molecular biologist, geneticist, and zoologist. In 1953, James Watson and Francis Crick co-authored an academic paper on DNA entitled, &quot;Molecular Structure of Nucleic Acids: A Structure for Deoxyribose Nucleic Acid&quot;. Published in the scientific journal Nature, the paper proposed the existence of the double helix structure of the DNA molecule, having built on research by Rosalind Franklin and Raymond Gosling. In 1962, the Nobel Prize in Physiology or Medicine was awarded to James Watson, Francis Crick, and Maurice Wilkins &quot;for their discoveries concerning the molecular structure of nucleic acids and its significance for information transfer in living material&quot;.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;James Watson&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 78, "nom": "Jennifer Doudna", "cat": "Scientist", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["nobel"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Jennifer Doudna<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/7e/Jennifer_Doudna_by_Christopher_Michel_in_2023_01.jpg/960px-Jennifer_Doudna_by_Christopher_Michel_in_2023_01.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Jennifer Doudna\" loading=\"lazy\"><div class=\"cred\">Christopher Michel · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Jennifer Anne Doudna is an American biochemist who has pioneered work in CRISPR gene editing, and made other fundamental contributions in biochemistry and genetics. She received the 2020 Nobel Prize in Chemistry, with Emmanuelle Charpentier, &quot;for the development of a method for genome editing.&quot; She is the Li Ka Shing Chancellor&#x27;s Chair Professor at the University of California, Berkeley. She has been an investigator with the Howard Hughes Medical Institute since 1997.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Jennifer Doudna&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 77, "nom": "Kary Mullis", "cat": "Scientist", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["nobel"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Kary Mullis<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/7/7f/Kary_Mullis.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Kary Mullis\" loading=\"lazy\"><div class=\"cred\">Dona Mapston · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Kary Banks Mullis was an American biochemist. In recognition of his role in the invention of the polymerase chain reaction (PCR) technique, he shared the 1993 Nobel Prize in Chemistry with Michael Smith and was awarded the Japan Prize in the same year. PCR became a central technique in biochemistry and molecular biology, described by The New York Times as &quot;highly original and significant, virtually dividing biology into the two epochs of before PCR and after PCR.&quot;<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Kary Mullis&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 61, "nom": "Marie Curie", "cat": "Scientist", "raresa": "epica", "rlabel": "Epic", "color": "#8e4fd1", "sets": ["nobel"], "html": "<article class=\"carta\" style=\"--r:#8e4fd1\"><header><h2>Marie Curie<\/h2><span>Epic<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c8/Marie_Curie_c._1920s.jpg/960px-Marie_Curie_c._1920s.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Marie Curie\" loading=\"lazy\"><div class=\"cred\">Henri Manuel · Public domain<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Maria Salomea Skłodowska Curie, better known as Marie Curie, was a Polish and naturalised-French physicist and chemist. She shared the 1903 Nobel Prize in Physics with her husband, Pierre Curie, &quot;for their joint researches on the radioactivity phenomena discovered by Professor Henri Becquerel&quot;. She won the 1911 Nobel Prize in Chemistry &quot;[for] the discovery of the elements radium and polonium, by the isolation of radium and the study of the nature and compounds of this remarkable element&quot;.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Marie Curie&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 74, "nom": "Paul Ehrlich", "cat": "Scientist", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["nobel"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Paul Ehrlich<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/05/Paul_Ehrlich_1915.jpg/960px-Paul_Ehrlich_1915.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Paul Ehrlich\" loading=\"lazy\"><div class=\"cred\">Harris &amp; Ewing · Public domain<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Paul Ehrlich was a German physician and scientist who worked in the fields of hematology, immunology and antimicrobial chemotherapy. He shared the 1908 Nobel Prize in Physiology or Medicine with Élie Metchnikoff &quot;in recognition of their work on immunity&quot;. Among his foremost achievements were finding a cure for syphilis in 1909 and inventing an important modification of the technique for Gram staining bacteria. The methods he developed for staining tissue made it possible to distinguish between different types of blood cells, which led to the ability to diagnose numerous blood diseases.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Paul Ehrlich&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 65, "nom": "Peyton Rous", "cat": "Scientist", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "nobel"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Peyton Rous<\/h2><span>Common<\/span><\/header><div class=\"img\"><div class=\"sense-img\"><svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/><\/svg><span>Scientist<\/span><\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Francis Peyton Rous was an American pathologist at the Rockefeller University known for his works in oncoviruses, blood transfusion and physiology of digestion. A medical graduate from the Johns Hopkins University, he was discouraged from becoming a practicing physician due to severe tuberculosis. After three years of working as an instructor of pathology at the University of Michigan, he became dedicated researcher at the Rockefeller Institute for Medical Research for the rest of his career.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Francis Peyton Rous&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 68, "nom": "Robert Weinberg", "cat": "Scientist", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Robert Weinberg<\/h2><span>Common<\/span><\/header><div class=\"img\"><div class=\"sense-img\"><svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/><\/svg><span>Scientist<\/span><\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Robert Allan Weinberg is an American biologist, Daniel K. Ludwig Professor for Cancer Research at Massachusetts Institute of Technology (MIT), director of the Ludwig Center of the MIT, and American Cancer Society Research Professor. His research is in the area of oncogenes and the genetic basis of human cancer.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Robert Weinberg (biologist)&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 62, "nom": "Rosalind Franklin", "cat": "Scientist", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": [], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>Rosalind Franklin<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/9/97/Rosalind_Franklin.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Rosalind Franklin\" loading=\"lazy\"><div class=\"cred\">MRC Laboratory of Molecular Biology · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Rosalind Elsie Franklin was an English chemist and X-ray crystallographer. Her work was central to the understanding of the molecular structures of DNA, RNA, viruses, coal, and graphite. Although her works on coal and viruses were appreciated in her lifetime, Franklin&#x27;s contributions to the discovery of the structure of DNA were largely unrecognised during her life, for which Franklin has been variously referred to as the &quot;wronged heroine&quot;, the &quot;dark lady of DNA&quot;, the &quot;forgotten heroine&quot;, a &quot;feminist icon&quot;, and the &quot;Sylvia Plath of molecular biology&quot;. James Watson believed that, had she not died, ideally, Franklin would have been awarded a Nobel Prize in Chemistry.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Rosalind Franklin&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 75, "nom": "Rudolf Virchow", "cat": "Scientist", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Rudolf Virchow<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Rudolf_Virchow_NLM3.jpg/960px-Rudolf_Virchow_NLM3.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Rudolf Virchow\" loading=\"lazy\"><div class=\"cred\">Unknown authorUnknown author · Public domain<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Rudolf Ludwig Carl Virchow was a German physician, anthropologist, pathologist, prehistorian, biologist, writer, editor, and politician. He is known as &quot;the father of modern pathology&quot; and as the founder of social medicine, and to his colleagues, the &quot;Pope of medicine&quot;.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Rudolf Virchow&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 72, "nom": "Tasuku Honjo", "cat": "Scientist", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "nobel"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Tasuku Honjo<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/b/b3/Tasuku_Honjo_201311.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Tasuku Honjo\" loading=\"lazy\"><div class=\"cred\">大臣官房人事課 · CC BY 4.0<\/div><\/div><div class=\"cat\">Scientist<\/div><p class=\"def\">Tasuku Honjo  is a Japanese physician-scientist and immunologist. He won the 2018 Nobel Prize in Physiology or Medicine and is best known for his identification of programmed cell death protein 1 (PD-1). He is also known for his molecular identification of cytokines IL-4 and IL-5, as well as the discovery of activation-induced cytidine deaminase (AID) that is essential for class switch recombination and somatic hypermutation.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Tasuku Honjo&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<circle cx=\"50\" cy=\"32\" r=\"16\" fill=\"currentColor\" opacity=\".85\"/><path d=\"M18 90c0-22 14-36 32-36s32 14 32 36z\" fill=\"currentColor\" opacity=\".85\"/>"}, {"id": 96, "nom": "Apoptosis", "cat": "Concept", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": ["cancer"], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>Apoptosis<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/2/23/Apoptosis_DU145_cells_mosaic.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Apoptosis\" loading=\"lazy\"><div class=\"cred\">Egelberg · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Concept<\/div><p class=\"def\">A regulated cell death mechanism characterized by distinctive morphologic changes in the nucleus and cytoplasm, including the endonucleolytic cleavage of genomic DNA, at regularly spaced, internucleosomal sites, i.e., DNA FRAGMENTATION. It is genetically programmed and serves as a balance to mitosis in regulating the size of animal tissues and in mediating pathologic processes associated with tumor growth.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Apoptosis&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M50 10a24 24 0 0 0-14 44c4 3 6 7 6 12h16c0-5 2-9 6-12A24 24 0 0 0 50 10z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M40 76h20M43 86h14\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>"}, {"id": 99, "nom": "Carcinogenesis", "cat": "Concept", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Carcinogenesis<\/h2><span>Common<\/span><\/header><div class=\"img\"><div class=\"sense-img\"><svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><path d=\"M50 10a24 24 0 0 0-14 44c4 3 6 7 6 12h16c0-5 2-9 6-12A24 24 0 0 0 50 10z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M40 76h20M43 86h14\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/><\/svg><span>Concept<\/span><\/div><\/div><div class=\"cat\">Concept<\/div><p class=\"def\">The origin, production or development of cancer through genotypic and phenotypic changes which upset the normal balance between cell proliferation and cell death. Carcinogenesis generally requires a constellation of steps, which may occur quickly or over a period of many years.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Carcinogenesis&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M50 10a24 24 0 0 0-14 44c4 3 6 7 6 12h16c0-5 2-9 6-12A24 24 0 0 0 50 10z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M40 76h20M43 86h14\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>"}, {"id": 100, "nom": "Immunotherapy", "cat": "Concept", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Immunotherapy<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f5/Peptide_bound_to_Rituximab_FAB.png/960px-Peptide_bound_to_Rituximab_FAB.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Immunotherapy\" loading=\"lazy\"><div class=\"cred\">Simon Caulton · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Concept<\/div><p class=\"def\">Manipulation of the host&#x27;s immune system in treatment of disease. It includes both active and passive immunization as well as immunosuppressive therapy to prevent graft rejection.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Immunotherapy&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M50 10a24 24 0 0 0-14 44c4 3 6 7 6 12h16c0-5 2-9 6-12A24 24 0 0 0 50 10z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M40 76h20M43 86h14\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>"}, {"id": 95, "nom": "Neoplasm metastasis", "cat": "Concept", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Neoplasm metastasis<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e5/Lymph_node_metastasis%2C_squamous_cell_carcinoma_bromchus.jpg/960px-Lymph_node_metastasis%2C_squamous_cell_carcinoma_bromchus.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Neoplasm metastasis\" loading=\"lazy\"><div class=\"cred\">Narraburra · CC0<\/div><\/div><div class=\"cat\">Concept<\/div><p class=\"def\">The transfer of a neoplasm from one organ or part of the body to another remote from the primary site.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Neoplasm Metastasis&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M50 10a24 24 0 0 0-14 44c4 3 6 7 6 12h16c0-5 2-9 6-12A24 24 0 0 0 50 10z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M40 76h20M43 86h14\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>"}, {"id": 94, "nom": "Neoplasms", "cat": "Concept", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Neoplasms<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/5/56/Tumor_Mesothelioma2_legend.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Neoplasms\" loading=\"lazy\"><div class=\"cred\">Stevenfruitsmaak · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Concept<\/div><p class=\"def\">New abnormal growth of tissue. Malignant neoplasms show a greater degree of anaplasia and have the properties of invasion and metastasis, compared to benign neoplasms.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Neoplasms&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M50 10a24 24 0 0 0-14 44c4 3 6 7 6 12h16c0-5 2-9 6-12A24 24 0 0 0 50 10z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M40 76h20M43 86h14\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>"}, {"id": 97, "nom": "Oncogenes", "cat": "Concept", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Oncogenes<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/de/Oncogenes_illustration.jpg/960px-Oncogenes_illustration.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Oncogenes\" loading=\"lazy\"><div class=\"cred\">Unknown Illustrator · Public domain<\/div><\/div><div class=\"cat\">Concept<\/div><p class=\"def\">Genes whose gain-of-function alterations lead to NEOPLASTIC CELL TRANSFORMATION. They include, for example, genes for activators or stimulators of CELL PROLIFERATION such as growth factors, growth factor receptors, protein kinases, signal transducers, nuclear phosphoproteins, and transcription factors. A prefix of v- before oncogene symbols indicates oncogenes captured and transmitted by RETROVIRUSES; the prefix c- before the gene symbol of an oncogene indicates it is the cellular homolog (PROTO-ONCOGENES) of a v-oncogene.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Oncogenes&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M50 10a24 24 0 0 0-14 44c4 3 6 7 6 12h16c0-5 2-9 6-12A24 24 0 0 0 50 10z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M40 76h20M43 86h14\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>"}, {"id": 98, "nom": "Tumor suppressor genes", "cat": "Concept", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Tumor suppressor genes<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Cell_Cycle_3-3.svg/960px-Cell_Cycle_3-3.svg.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Tumor suppressor genes\" loading=\"lazy\"><div class=\"cred\">Cell_Cycle_3.png: *Cell_Cycle_2.svg: *Cell_Cycle_2.png: Original uploader was Zephyris at en.wikipedia\nderivative work: Beao\nderivative work: Histidine (talk)\nderivative work: Histidine (talk) · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Concept<\/div><p class=\"def\">Genes that inhibit expression of the tumorigenic phenotype. They are normally involved in holding cellular growth in check. When tumor suppressor genes are inactivated or lost, a barrier to normal proliferation is removed and unregulated growth is possible.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Genes, Tumor Suppressor&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M50 10a24 24 0 0 0-14 44c4 3 6 7 6 12h16c0-5 2-9 6-12A24 24 0 0 0 50 10z\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M40 76h20M43 86h14\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linecap=\"round\"/>"}, {"id": 26, "nom": "ABL1", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>ABL1<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/op/1opl/1opl_assembly-1.jpeg\" alt=\"ABL1\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 1OPL · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Non-receptor tyrosine-protein kinase that plays a role in many key processes linked to cell growth and survival such as cytoskeleton remodeling in response to extracellular stimuli, cell motility and adhesion, receptor endocytosis, autophagy, DNA damage response and apoptosis. Coordinates actin remodeling through tyrosine phosphorylation of proteins controlling cytoskeleton dynamics like WASF3 (involved in branch formation); ANXA1 (involved in membrane anchoring); DBN1, DBNL, CTTN, RAPH1 and ENAH (involved in signaling); or MAPT and PXN (microtubule-binding proteins). Phosphorylation of WASF3 is critical for the stimulation of lamellipodia formation and cell migration. Involved in the regulation of cell adhesion and motility through phosphorylation of key regulators of these processes such as BCAR1, CRK, CRKL, DOK1, EFS or NEDD9 (PubMed:22810897). Phosphorylates multiple receptor tyrosine kinases and more particularly promotes endocytosis of EGFR, facilitates the formation of neuromuscular synapses through MUSK, inhibits PDGFRB-mediated chemotaxis and modulates the endocytosis of activated B-cell receptor complexes. Other substrates which are involved in endocytosis regulation are the caveolin (CAV1) and RIN1. Moreover, ABL1 regulates the CBL family of ubiquitin ligases that drive receptor down-regulation and actin remodeling. Phosphorylation of CBL leads to increased EGFR stability. Involved in late-stage autophagy by regulating positively the trafficking and function of lysosomal components. ABL1 targets to mitochondria in response to oxidative stress and thereby mediates mitochondrial dysfunction and cell death. In response to oxidative stress, phosphorylates serine/threonine kinase PRKD2 at &#x27;Tyr-717&#x27; (PubMed:28428613). ABL1 is also translocated in the nucleus where it has DNA-binding activity and is involved in DNA-damage response and apoptosis. Many substrates are known mediators of DNA repair: DDB1, DDB2, ERCC3, ERCC6, RAD9A, RAD51, RAD52 or WRN. Activates the proapoptotic pathway when the DNA damage is too severe to be repaired. Phosphorylates TP73, a primary regulator for this type of damage-induced apoptosis. Phosphorylates the caspase CASP9 on &#x27;Tyr-153&#x27; and regulates its processing in the apoptotic response to DNA damage. Phosphorylates PSMA7 that leads to an inhibition of proteasomal activity and cell cycle transition blocks. ABL1 also acts as a regulator of multiple pathological signaling cascades during infection. Several known tyrosine-phosphorylated microbial proteins have been identified as ABL1 substrates. This is the case of A36R of Vaccinia virus, Tir (translocated intimin receptor) of pathogenic E.coli and possibly Citrobacter, CagA (cytotoxin-associated gene A) of H.pylori, or AnkA (ankyrin repeat-containing protein A) of A.phagocytophilum. Pathogens can highjack ABL1 kinase signaling to reorganize the host actin cytoskeleton for multiple purposes, like facilitating intracellular movement and host cell exit. Finally, functions as its own regulator through autocatalytic activity as well as through phosphorylation of its inhibitor, ABI1. Regulates T-cell differentiation in a TBX21-dependent manner (By similarity). Positively regulates chemokine-mediated T-cell migration, polarization, and homing to lymph nodes and immune-challenged tissues, potentially via activation of NEDD9/HEF1 and RAP1 (By similarity). Phosphorylates TBX21 on tyrosine residues leading to an enhancement of its transcriptional activator activity (By similarity)<\/p><p class=\"font\">Source: UniProt P00519 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>9<\/b><\/li><li><span>Length (aa)<\/span><b>1130<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 30, "nom": "AKT1", "cat": "Gene / protein", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>AKT1<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/nh/7nh5/7nh5_assembly-1.jpeg\" alt=\"AKT1\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 7NH5 · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">AKT1 is one of 3 closely related serine/threonine-protein kinases (AKT1, AKT2 and AKT3) called the AKT kinase, and which regulate many processes including metabolism, proliferation, cell survival, growth and angiogenesis (PubMed:11882383, PubMed:15526160, PubMed:15861136, PubMed:21432781, PubMed:21620960, PubMed:31204173). This is mediated through serine and/or threonine phosphorylation of a range of downstream substrates (PubMed:11882383, PubMed:15526160, PubMed:21432781, PubMed:21620960, PubMed:29343641, PubMed:31204173). Over 100 substrate candidates have been reported so far, but for most of them, no isoform specificity has been reported (PubMed:11882383, PubMed:15526160, PubMed:21432781, PubMed:21620960). AKT is responsible of the regulation of glucose uptake by mediating insulin-induced translocation of the SLC2A4/GLUT4 glucose transporter to the cell surface (By similarity). Phosphorylation of PTPN1 at &#x27;Ser-50&#x27; negatively modulates its phosphatase activity preventing dephosphorylation of the insulin receptor and the attenuation of insulin signaling (By similarity). Phosphorylation of TBC1D4 triggers the binding of this effector to inhibitory 14-3-3 proteins, which is required for insulin-stimulated glucose transport (PubMed:11994271). AKT also regulates the storage of glucose in the form of glycogen by phosphorylating GSK3A at &#x27;Ser-21&#x27; and GSK3B at &#x27;Ser-9&#x27;, resulting in inhibition of its kinase activity (By similarity). Phosphorylation of GSK3 isoforms by AKT is also thought to be one mechanism by which cell proliferation is driven (By similarity). AKT also regulates cell survival via the phosphorylation of MAP3K5 (apoptosis signal-related kinase) (PubMed:11154276). Phosphorylation of &#x27;Ser-83&#x27; decreases MAP3K5 kinase activity stimulated by oxidative stress and thereby prevents apoptosis (PubMed:11154276). AKT mediates insulin-stimulated protein synthesis by phosphorylating TSC2 at &#x27;Ser-939&#x27; and &#x27;Thr-1462&#x27;, thereby activating the mTORC1 signaling pathway, and leading to both phosphorylation of 4E-BP1 and in activation of RPS6KB1 (PubMed:12150915, PubMed:12172553). Also regulates the mTORC1 signaling pathway by catalyzing phosphorylation of CASTOR1 and DEPDC5 (PubMed:31548394, PubMed:33594058). AKT plays a role as key modulator of the AKT-mTOR signaling pathway controlling the tempo of the process of newborn neurons integration during adult neurogenesis, including correct neuron positioning, dendritic development and synapse formation (By similarity). Part of a positive feedback loop of mTORC2 signaling by mediating phosphorylation of MAPKAP1/SIN1, promoting mTORC2 activation (By similarity). AKT is involved in the phosphorylation of members of the FOXO factors (Forkhead family of transcription factors), leading to binding of 14-3-3 proteins and cytoplasmic localization (PubMed:10358075). In particular, FOXO1 is phosphorylated at &#x27;Thr-24&#x27;, &#x27;Ser-256&#x27; and &#x27;Ser-319&#x27; (PubMed:10358075). FOXO3 and FOXO4 are phosphorylated on equivalent sites (PubMed:10358075). AKT has an important role in the regulation of NF-kappa-B-dependent gene transcription and positively regulates the activity of CREB1 (cyclic AMP (cAMP)-response element binding protein) (PubMed:9829964). The phosphorylation of CREB1 induces the binding of accessory proteins that are necessary for the transcription of pro-survival genes such as BCL2 and MCL1 (PubMed:9829964). AKT phosphorylates &#x27;Ser-454&#x27; on ATP citrate lyase (ACLY), thereby potentially regulating ACLY activity and fatty acid synthesis (By similarity). Activates the 3B isoform of cyclic nucleotide phosphodiesterase (PDE3B) via phosphorylation of &#x27;Ser-273&#x27;, resulting in reduced cyclic AMP levels and inhibition of lipolysis (By similarity). Phosphorylates PIKFYVE on &#x27;Ser-318&#x27;, which results in increased PI(3)P-5 activity (By similarity). The Rho GTPase-activating protein DLC1 is another substrate and its phosphorylation is implicated in the regulation cell proliferation and cell growth (By similarity). Signals downstream of phosphatidylinositol 3-kinase (PI(3)K) to mediate the effects of various growth factors such as platelet-derived growth factor (PDGF), epidermal growth factor (EGF), insulin and insulin-like growth factor 1 (IGF1) (PubMed:12176338, PubMed:12964941). AKT mediates the antiapoptotic effects of IGF1 (By similarity). Essential for the SPATA13-mediated regulation of cell migration and adhesion assembly and disassembly (PubMed:19934221). May be involved in the regulation of the placental development (By similarity). Phosphorylates STK4/MST1 at &#x27;Thr-120&#x27; and &#x27;Thr-387&#x27; leading to inhibition of its: kinase activity, nuclear translocation, autophosphorylation and ability to phosphorylate FOXO3 (PubMed:17726016). Phosphorylates STK3/MST2 at &#x27;Thr-117&#x27; and &#x27;Thr-384&#x27; leading to inhibition of its: cleavage, kinase activity, autophosphorylation at Thr-180, binding to RASSF1 and nuclear translocation (PubMed:20086174). Phosphorylates SRPK2 and enhances its kinase activity towards SRSF2 and ACIN1 and promotes its nuclear translocation (PubMed:19592491). Phosphorylates RAF1 at &#x27;Ser-259&#x27; and negatively regulates its activity (PubMed:10576742). Phosphorylation of BAD stimulates its pro-apoptotic activity (PubMed:10926925). Phosphorylates KAT6A at &#x27;Thr-369&#x27; and this phosphorylation inhibits the interaction of KAT6A with PML and negatively regulates its acetylation activity towards p53/TP53 (PubMed:23431171). Phosphorylates palladin (PALLD), modulating cytoskeletal organization and cell motility (PubMed:20471940). Phosphorylates prohibitin (PHB), playing an important role in cell metabolism and proliferation (PubMed:18507042). Phosphorylates CDKN1A, for which phosphorylation at &#x27;Thr-145&#x27; induces its release from CDK2 and cytoplasmic relocalization (PubMed:16982699). These recent findings indicate that the AKT1 isoform has a more specific role in cell motility and proliferation (PubMed:16139227). Phosphorylates CLK2 thereby controlling cell survival to ionizing radiation (PubMed:20682768). Phosphorylates PCK1 at &#x27;Ser-90&#x27;, reducing the binding affinity of PCK1 to oxaloacetate and changing PCK1 into an atypical protein kinase activity using GTP as donor (PubMed:32322062). Also acts as an activator of TMEM175 potassium channel activity in response to growth factors: forms the lysoK(GF) complex together with TMEM175 and acts by promoting TMEM175 channel activation, independently of its protein kinase activity (PubMed:32228865). Acts as a regulator of mitochondrial calcium uptake by mediating phosphorylation of MICU1 in the mitochondrial intermembrane space, impairing MICU1 maturation (PubMed:30504268). Acts as an inhibitor of tRNA methylation by mediating phosphorylation of the N-terminus of METTL1, thereby inhibiting METTL1 methyltransferase activity (PubMed:15861136). In response to LPAR1 receptor pathway activation, phosphorylates Rabin8/RAB3IP which alters its activity and phosphorylates WDR44 which induces WDR44 binding to Rab11, thereby switching Rab11 vesicular function from preciliary trafficking to endocytic recycling (PubMed:31204173)<\/p><p class=\"font\">Source: UniProt P31749 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>14<\/b><\/li><li><span>Length (aa)<\/span><b>480<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 34, "nom": "ALK", "cat": "Gene / protein", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": ["cancer", "oncogenes"], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>ALK<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/nx/7nx3/7nx3_assembly-1.jpeg\" alt=\"ALK\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 7NX3 · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Neuronal receptor tyrosine kinase that is essentially and transiently expressed in specific regions of the central and peripheral nervous systems and plays an important role in the genesis and differentiation of the nervous system (PubMed:11121404, PubMed:11387242, PubMed:16317043, PubMed:17274988, PubMed:30061385, PubMed:34646012, PubMed:34819673). Also acts as a key thinness protein involved in the resistance to weight gain: in hypothalamic neurons, controls energy expenditure acting as a negative regulator of white adipose tissue lipolysis and sympathetic tone to fine-tune energy homeostasis (By similarity). Following activation by ALKAL2 ligand at the cell surface, transduces an extracellular signal into an intracellular response (PubMed:30061385, PubMed:33411331, PubMed:34646012, PubMed:34819673). In contrast, ALKAL1 is not a potent physiological ligand for ALK (PubMed:34646012). Ligand-binding to the extracellular domain induces tyrosine kinase activation, leading to activation of the mitogen-activated protein kinase (MAPK) pathway (PubMed:34819673). Phosphorylates almost exclusively at the first tyrosine of the Y-x-x-x-Y-Y motif (PubMed:15226403, PubMed:16878150). Induces tyrosine phosphorylation of CBL, FRS2, IRS1 and SHC1, as well as of the MAP kinases MAPK1/ERK2 and MAPK3/ERK1 (PubMed:15226403, PubMed:16878150). ALK activation may also be regulated by pleiotrophin (PTN) and midkine (MDK) (PubMed:11278720, PubMed:11809760, PubMed:12107166, PubMed:12122009). PTN-binding induces MAPK pathway activation, which is important for the anti-apoptotic signaling of PTN and regulation of cell proliferation (PubMed:11278720, PubMed:11809760, PubMed:12107166). MDK-binding induces phosphorylation of the ALK target insulin receptor substrate (IRS1), activates mitogen-activated protein kinases (MAPKs) and PI3-kinase, resulting also in cell proliferation induction (PubMed:12122009). Drives NF-kappa-B activation, probably through IRS1 and the activation of the AKT serine/threonine kinase (PubMed:15226403, PubMed:16878150). Recruitment of IRS1 to activated ALK and the activation of NF-kappa-B are essential for the autocrine growth and survival signaling of MDK (PubMed:15226403, PubMed:16878150). May function as regulator of gastric epithelial differentiation (By similarity)<\/p><p class=\"font\">Source: UniProt Q9UM73 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>2<\/b><\/li><li><span>Length (aa)<\/span><b>1620<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" stroke-width=\"3\" opacity=\".6\"/>"}, {"id": 16, "nom": "APC", "cat": "Gene / protein", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": ["cancer", "suppressors"], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>APC<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://cdn.rcsb.org/images/structures/nm/3nmz/3nmz_assembly-1.jpeg\" alt=\"APC\" loading=\"lazy\"><div class=\"cred\">RCSB PDB entry 3NMZ · CC0 1.0 (PDB data, to be verified)<\/div><\/div><div class=\"cat\">Gene / protein<\/div><p class=\"def\">Tumor suppressor. Promotes rapid degradation of CTNNB1 and participates in Wnt signaling as a negative regulator. APC activity is correlated with its phosphorylation state. Activates the GEF activity of SPATA13 and ARHGEF4. Plays a role in hepatocyte growth factor (HGF)-induced cell migration. Required for MMP9 up-regulation via the JNK signaling pathway in colorectal tumor cells. Associates with both microtubules and actin filaments, components of the cytoskeleton (PubMed:17293347). Plays a role in mediating the organization of F-actin into ordered bundles (PubMed:17293347). Functions downstream of Rho GTPases and DIAPH1 to selectively stabilize microtubules (By similarity). Acts as a mediator of ERBB2-dependent stabilization of microtubules at the cell cortex. It is required for the localization of MACF1 to the cell membrane and this localization of MACF1 is critical for its function in microtubule stabilization<\/p><p class=\"font\">Source: UniProt P25054 (CC BY 4.0, to be verified)<\/p><ul class=\"stats\"><li><span>Chromosome<\/span><b>5<\/b><\/li><li><span>Length (aa)<\/span><b>2843<\/b><\/li><\/ul><\/article>", "icona": "<path d=\"M30 8c0 28 40 36 40 84M70 8c0 28-40 36-40 84\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><path d=\"M36 22h28M33 40h34M33 60h34M36 78h28\" stroke=\"currentColor\" str
