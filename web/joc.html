n=imageinfo&amp;utm_content=thumbnail\" alt=\"MCF-7\" loading=\"lazy\"><div class=\"cred\">SubtleGuest · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Cell line<\/div><p class=\"def\">MCF-7 is a breast cancer cell line. MCF-7 is the acronym of Michigan Cancer Foundation-7, referring to the institute in Detroit where the cell line was established in 1973 by Herbert Soule and co-workers. The Michigan Cancer Foundation is now known as the Barbara Ann Karmanos Cancer Institute.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;MCF-7&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"46\" cy=\"46\" r=\"14\" fill=\"currentColor\" opacity=\".8\"/><circle cx=\"70\" cy=\"62\" r=\"4\" fill=\"currentColor\"/><circle cx=\"30\" cy=\"66\" r=\"3\" fill=\"currentColor\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"currentColor\"/>"}, {"id": 92, "nom": "U2OS", "cat": "Cell line", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": ["cancer", "cell-lines"], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>U2OS<\/h2><span>Common<\/span><\/header><div class=\"img\"><div class=\"sense-img\"><svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"46\" cy=\"46\" r=\"14\" fill=\"currentColor\" opacity=\".8\"/><circle cx=\"70\" cy=\"62\" r=\"4\" fill=\"currentColor\"/><circle cx=\"30\" cy=\"66\" r=\"3\" fill=\"currentColor\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"currentColor\"/><\/svg><span>Cell line<\/span><\/div><\/div><div class=\"cat\">Cell line<\/div><p class=\"def buit\">Definition pending<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<ellipse cx=\"50\" cy=\"50\" rx=\"40\" ry=\"34\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\"/><circle cx=\"46\" cy=\"46\" r=\"14\" fill=\"currentColor\" opacity=\".8\"/><circle cx=\"70\" cy=\"62\" r=\"4\" fill=\"currentColor\"/><circle cx=\"30\" cy=\"66\" r=\"3\" fill=\"currentColor\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"currentColor\"/>"}, {"id": 82, "nom": "Agarose", "cat": "Reagent", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Agarose<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d6/Two_percent_Agarose_Gel_in_Borate_Buffer_cast_in_a_Gel_Tray_%28Front%2C_angled%29.jpg/960px-Two_percent_Agarose_Gel_in_Borate_Buffer_cast_in_a_Gel_Tray_%28Front%2C_angled%29.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Agarose\" loading=\"lazy\"><div class=\"cred\">Joseph Elsbernd · CC BY 2.0<\/div><\/div><div class=\"cat\">Reagent<\/div><p class=\"def\">Agarose is a polysaccharide, generally extracted from certain red algae. It is a linear polymer made up of the repeating unit of agarobiose, which is a disaccharide made up of D-galactose and 3,6-anhydro-L-galactopyranose. Agarose is one of the two principal components of agar, and is purified from agar by removing agar&#x27;s other component, agaropectin.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Agarose&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M40 10h20M44 10v22L24 76a10 10 0 0 0 9 14h34a10 10 0 0 0 9-14L56 32V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 66c10-6 16 6 40 0l6 10a6 6 0 0 1-5 9H31a6 6 0 0 1-5-9z\" fill=\"currentColor\" opacity=\".7\"/>"}, {"id": 12, "nom": "DMSO", "cat": "Reagent", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>DMSO<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/3/38/DMSO-2D-dimensions.svg/960px-DMSO-2D-dimensions.svg.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"DMSO\" loading=\"lazy\"><div class=\"cred\">User:Benjah-bmm27 · Public domain<\/div><\/div><div class=\"cat\">Reagent<\/div><p class=\"def\">Dimethyl sulfoxide (DMSO) is an organosulfur compound with the formula (CH3)2S=O. This colorless liquid is the sulfoxide most widely used commercially. It is an important polar aprotic solvent that dissolves both polar and nonpolar compounds and is miscible in a wide range of organic solvents as well as water. It has a relatively high boiling point. DMSO is metabolised to compounds that leave a garlic-like taste in the mouth after DMSO is absorbed by the skin.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Dimethyl sulfoxide&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M40 10h20M44 10v22L24 76a10 10 0 0 0 9 14h34a10 10 0 0 0 9-14L56 32V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 66c10-6 16 6 40 0l6 10a6 6 0 0 1-5 9H31a6 6 0 0 1-5-9z\" fill=\"currentColor\" opacity=\".7\"/>"}, {"id": 81, "nom": "Ethidium bromide", "cat": "Reagent", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Ethidium bromide<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/0a/Ethidium_bromide.svg/960px-Ethidium_bromide.svg.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Ethidium bromide\" loading=\"lazy\"><div class=\"cred\">Calvero. · Public domain<\/div><\/div><div class=\"cat\">Reagent<\/div><p class=\"def\">Ethidium bromide is an intercalating agent commonly used as a fluorescent tag in molecular biology laboratories for techniques such as agarose gel electrophoresis. It is commonly abbreviated as EtBr, which is also an abbreviation for bromoethane. To avoid confusion, some laboratories have used the abbreviation EthBr for this salt. When exposed to ultraviolet light, it will fluoresce with an orange colour, intensifying almost 20-fold after binding to DNA. Under the name homidium, it has been commonly used since the 1950s in veterinary medicine to treat trypanosomiasis in cattle. The high incidence of antimicrobial resistance makes this treatment impractical in some areas, where the related isometamidium chloride is used instead. Despite its reputation as a mutagen, tests have shown it to have low mutagenicity without metabolic activation.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Ethidium bromide&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M40 10h20M44 10v22L24 76a10 10 0 0 0 9 14h34a10 10 0 0 0 9-14L56 32V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 66c10-6 16 6 40 0l6 10a6 6 0 0 1-5 9H31a6 6 0 0 1-5-9z\" fill=\"currentColor\" opacity=\".7\"/>"}, {"id": 83, "nom": "Formaldehyde", "cat": "Reagent", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Formaldehyde<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/7/76/Formaldehyde-3D-balls-A.png/960px-Formaldehyde-3D-balls-A.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Formaldehyde\" loading=\"lazy\"><div class=\"cred\">Ben Mills · Public domain<\/div><\/div><div class=\"cat\">Reagent<\/div><p class=\"def\">Formaldehyde is a pungent colorless gas mainly used in the production of industrial resins, such as for particle board, coatings, plastics, pulp, paper, synthetic fibers, and textiles. A ~5% solution in water of formaldehyde is used as a disinfectant and fumigant in industrial, agricultural, and healthcare settings, and a ~37% solution is used to preserve tissue samples in labs. In 2024, the global production of formaldehyde was estimated at 26 million tons per year, and is a precursor to many other materials and chemical compounds.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Formaldehyde&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M40 10h20M44 10v22L24 76a10 10 0 0 0 9 14h34a10 10 0 0 0 9-14L56 32V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 66c10-6 16 6 40 0l6 10a6 6 0 0 1-5 9H31a6 6 0 0 1-5-9z\" fill=\"currentColor\" opacity=\".7\"/>"}, {"id": 85, "nom": "PBS", "cat": "Reagent", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>PBS<\/h2><span>Common<\/span><\/header><div class=\"img\"><div class=\"sense-img\"><svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><path d=\"M40 10h20M44 10v22L24 76a10 10 0 0 0 9 14h34a10 10 0 0 0 9-14L56 32V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 66c10-6 16 6 40 0l6 10a6 6 0 0 1-5 9H31a6 6 0 0 1-5-9z\" fill=\"currentColor\" opacity=\".7\"/><\/svg><span>Reagent<\/span><\/div><\/div><div class=\"cat\">Reagent<\/div><p class=\"def\">Phosphate-buffered saline (PBS) is a buffer solution commonly used in biological research. It is a water-based salt solution containing disodium hydrogen phosphate, sodium chloride and, in some formulations, potassium chloride and potassium dihydrogen phosphate. The buffer helps to maintain a constant pH. The osmolarity and ion concentrations of the solutions are isotonic, meaning they match those of the human body.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Phosphate-buffered saline&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M40 10h20M44 10v22L24 76a10 10 0 0 0 9 14h34a10 10 0 0 0 9-14L56 32V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 66c10-6 16 6 40 0l6 10a6 6 0 0 1-5 9H31a6 6 0 0 1-5-9z\" fill=\"currentColor\" opacity=\".7\"/>"}, {"id": 84, "nom": "SDS", "cat": "Reagent", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>SDS<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><div class=\"sense-img\"><svg viewBox=\"0 0 100 100\" aria-hidden=\"true\"><path d=\"M40 10h20M44 10v22L24 76a10 10 0 0 0 9 14h34a10 10 0 0 0 9-14L56 32V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 66c10-6 16 6 40 0l6 10a6 6 0 0 1-5 9H31a6 6 0 0 1-5-9z\" fill=\"currentColor\" opacity=\".7\"/><\/svg><span>Reagent<\/span><\/div><\/div><div class=\"cat\">Reagent<\/div><p class=\"def\">Sodium dodecyl sulfate (SDS) or sodium lauryl sulfate (SLS), sometimes written sodium laurilsulfate, is an organic compound with the formula CH3(CH2)11OSO3Na and structure H3C−(CH2)11−O−S(=O)2−O−Na+. It is an anionic surfactant used in many cleaning and hygiene products. This compound is the sodium salt of the 12-carbon organosulfate. Its hydrocarbon tail combined with a polar &quot;headgroup&quot; gives the compound amphiphilic properties that make it useful as a detergent. SLS is also component of mixtures produced from inexpensive coconut and palm oils. SLS is a common component of many cleaning, personal hygiene and cosmetic, pharmaceutical, and food products, as well as of industrial and commercial cleaning and product formulations.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Sodium dodecyl sulfate&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M40 10h20M44 10v22L24 76a10 10 0 0 0 9 14h34a10 10 0 0 0 9-14L56 32V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 66c10-6 16 6 40 0l6 10a6 6 0 0 1-5 9H31a6 6 0 0 1-5-9z\" fill=\"currentColor\" opacity=\".7\"/>"}, {"id": 86, "nom": "Tris", "cat": "Reagent", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Tris<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/2-amino-2-%28hydroxymethyl%29propane-1%2C3-diol_200.svg/960px-2-amino-2-%28hydroxymethyl%29propane-1%2C3-diol_200.svg.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Tris\" loading=\"lazy\"><div class=\"cred\">Emeldir (talk) · Public domain<\/div><\/div><div class=\"cat\">Reagent<\/div><p class=\"def\">Tris, or tris(hydroxymethyl)aminomethane, or known during medical use as tromethamine or THAM, is an organic compound with the formula (HOCH2)3CNH2. It is extensively used in biochemistry and molecular biology as a component of buffer solutions such as in TAE and TBE buffers, especially for solutions of nucleic acids. It contains a primary amine and thus undergoes the reactions associated with typical amines, e.g., condensations with aldehydes. Tris also complexes with metal ions in solution. In medicine, tris (known as tromethamine) is occasionally used as a drug, given in intensive care for its properties as a buffer for the treatment of severe metabolic acidosis in specific circumstances. Some medications are formulated as the &quot;tromethamine salt&quot; including Hemabate (carboprost as trometamol salt), and &quot;ketorolac trometamol&quot;. In 2023 a strain of Pseudomonas hunanensis was found to be able to degrade TRIS buffer.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Tris&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M40 10h20M44 10v22L24 76a10 10 0 0 0 9 14h34a10 10 0 0 0 9-14L56 32V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 66c10-6 16 6 40 0l6 10a6 6 0 0 1-5 9H31a6 6 0 0 1-5-9z\" fill=\"currentColor\" opacity=\".7\"/>"}, {"id": 80, "nom": "Trypsin", "cat": "Reagent", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": [], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>Trypsin<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/88/ChimeraX_rendering_of_bovine_trypsin_%28PDB_1UTN%29.png/960px-ChimeraX_rendering_of_bovine_trypsin_%28PDB_1UTN%29.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Trypsin\" loading=\"lazy\"><div class=\"cred\">0fb1d8 · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Reagent<\/div><p class=\"def\">Trypsins are a type of enzyme that often function as digestive enzymes in humans and other vertebrates. They are a type of protease which means they act by helping to break bonds between amino acids in proteins. Digestive trypsins are part of an intermediate stage of protein digestion, where they cut long chains of amino acids into smaller pieces near the start of the small intestines. More generally, trypsins are serine protease enzymes from the PA clan superfamily, and in humans there are three classical varieties: trypsin 1, 2, and 3.<\/p><p class=\"font\">Source: Wikipedia, article &#x27;Trypsin&#x27; (CC BY-SA 4.0)<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M40 10h20M44 10v22L24 76a10 10 0 0 0 9 14h34a10 10 0 0 0 9-14L56 32V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 66c10-6 16 6 40 0l6 10a6 6 0 0 1-5 9H31a6 6 0 0 1-5-9z\" fill=\"currentColor\" opacity=\".7\"/>"}, {"id": 45, "nom": "CRISPR", "cat": "Technique", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>CRISPR<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/8d/4QYZ.png/960px-4QYZ.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"CRISPR\" loading=\"lazy\"><div class=\"cred\">Boghog · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">Adaptive antiviral defense mechanisms, in archaea and bacteria, based on DNA repeat arrays called CLUSTERED REGULARLY INTERSPACED SHORT PALINDROMIC REPEATS (CRISPR elements) that function in conjunction with CRISPR-ASSOCIATED PROTEINS (Cas proteins). Several types have been distinguished, including Type I, Type II, and Type III, based on signature motifs of CRISPR-ASSOCIATED PROTEINS.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;CRISPR-Cas Systems&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 46, "nom": "Cell culture", "cat": "Technique", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Cell culture<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/5/55/XBio_illustration_%E2%80%93_Tissue_Culture.png/960px-XBio_illustration_%E2%80%93_Tissue_Culture.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Cell culture\" loading=\"lazy\"><div class=\"cred\">explorebiology · CC BY 4.0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">Methods for maintaining or growing CELLS in vitro.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Cell Culture Techniques&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 48, "nom": "Chromatography", "cat": "Technique", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": [], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>Chromatography<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/d/d4/Chromatography_of_chlorophyll_-_Step_7.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Chromatography\" loading=\"lazy\"><div class=\"cred\">Flo~commonswiki · CC BY-SA 2.5<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">Techniques used to separate mixtures of substances based on differences in the relative affinities of the substances for mobile and stationary phases. A mobile phase (fluid or gas) passes through a column containing a stationary phase of porous solid or liquid coated on a solid support. Usage is both analytical for small amounts and preparative for bulk amounts.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Chromatography&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 42, "nom": "DNA sequencing", "cat": "Technique", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>DNA sequencing<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f0/Hybridogenesis_in_water_frogs_gametes.svg/960px-Hybridogenesis_in_water_frogs_gametes.svg.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"DNA sequencing\" loading=\"lazy\"><div class=\"cred\">Original: Darekk2, SVG: Palosirkka · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">A multistage process that includes cloning, physical mapping, subcloning, determination of the DNA SEQUENCE, and information analysis.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Sequence Analysis, DNA&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 39, "nom": "ELISA", "cat": "Technique", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>ELISA<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/ELISA_TMB.jpg/960px-ELISA_TMB.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"ELISA\" loading=\"lazy\"><div class=\"cred\">Ajpolino · CC0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">An immunoassay utilizing an antibody labeled with an enzyme marker such as horseradish peroxidase. While either the enzyme or the antibody is bound to an immunosorbent substrate, they both retain their biologic activity; the change in enzyme activity as a result of the enzyme-antibody-antigen reaction is proportional to the concentration of the antigen and can be measured spectrophotometrically or with the naked eye. Many variations of the method have been developed.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Enzyme-Linked Immunosorbent Assay&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 7, "nom": "Flow cytometry", "cat": "Technique", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Flow cytometry<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d1/FACS-buisje.JPG/960px-FACS-buisje.JPG?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Flow cytometry\" loading=\"lazy\"><div class=\"cred\">Biol · Public domain<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">Technique using an instrument system for making, processing, and displaying one or more measurements on individual cells obtained from a cell suspension. Cells are usually stained with one or more fluorescent dyes specific to cell components of interest, e.g., DNA, and fluorescence of each cell is measured as it rapidly transverses the excitation beam (laser or mercury arc lamp). Fluorescence provides a quantitative measure of various biochemical and biophysical properties of the cell, as well as a basis for cell sorting. Other measurable optical parameters include light absorption and light scattering, the latter being applicable to the measurement of cell size, shape, density, granularity, and stain uptake.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &quot;Flow Cytometry&quot;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 43, "nom": "Fluorescence microscopy", "cat": "Technique", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Fluorescence microscopy<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/d/dd/Olympus-BX61-fluorescence_microscope.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Fluorescence microscopy\" loading=\"lazy\"><div class=\"cred\">Masur · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">Microscopy of specimens stained with fluorescent dye (usually fluorescein isothiocyanate) or of naturally fluorescent materials, which emit light when exposed to ultraviolet or blue light. Immunofluorescence microscopy utilizes antibodies that are labeled with fluorescent dye.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Microscopy, Fluorescence&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 47, "nom": "Gel electrophoresis", "cat": "Technique", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Gel electrophoresis<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a6/Gel_electrophoresis_apparatus.JPG/960px-Gel_electrophoresis_apparatus.JPG?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Gel electrophoresis\" loading=\"lazy\"><div class=\"cred\">Jeffrey M. Vinocur · CC BY 2.5<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">Electrophoresis in which agar or agarose gel is used as the diffusion medium.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Electrophoresis, Agar Gel&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 50, "nom": "Immunofluorescence", "cat": "Technique", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Immunofluorescence<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/af/Blood_vessels_in_porcine_skin_-_SMA_A488_-_20x.jpg/960px-Blood_vessels_in_porcine_skin_-_SMA_A488_-_20x.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Immunofluorescence\" loading=\"lazy\"><div class=\"cred\">Alizee Pathology LLC. · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">Test for tissue antigen using either a direct method, by conjugation of antibody with fluorescent dye (FLUORESCENT ANTIBODY TECHNIQUE, DIRECT) or an indirect method, by formation of antigen-antibody complex which is then labeled with fluorescein-conjugated anti-immunoglobulin antibody (FLUORESCENT ANTIBODY TECHNIQUE, INDIRECT). The tissue is then examined by fluorescence microscopy.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Fluorescent Antibody Technique&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 40, "nom": "Immunohistochemistry", "cat": "Technique", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Immunohistochemistry<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a1/Main_staining_patterns_on_immunohistochemistry.jpg/960px-Main_staining_patterns_on_immunohistochemistry.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Immunohistochemistry\" loading=\"lazy\"><div class=\"cred\">Mikael Häggström, M.D. Author info - Reusing images- Conflicts of interest:  None\nMikael Häggström, M.D.Consent note: Consent from the patient or patient&#x27;s relatives is regarded as redundant, because of absence of identifiable features (List of HIPAA identifiers) in the media and case information (See also HIPAA case reports guidance). · CC0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">Histochemical localization of immunoreactive substances using labeled antibodies as reagents.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Immunohistochemistry&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 41, "nom": "Mass spectrometry", "cat": "Technique", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": [], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>Mass spectrometry<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e6/Discovery_of_neon_isotopes.JPG/960px-Discovery_of_neon_isotopes.JPG?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Mass spectrometry\" loading=\"lazy\"><div class=\"cred\">Francis William Aston · Public domain<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">An analytical method used in determining the identity of a chemical based on its mass using mass analyzers/mass spectrometers.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Mass Spectrometry&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 6, "nom": "PCR", "cat": "Technique", "raresa": "rara", "rlabel": "Rare", "color": "#2f7fd1", "sets": [], "html": "<article class=\"carta\" style=\"--r:#2f7fd1\"><header><h2>PCR<\/h2><span>Rare<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/b/b5/XBio_illustration_%E2%80%93_Polymerase_Chain_Reaction.png/960px-XBio_illustration_%E2%80%93_Polymerase_Chain_Reaction.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"PCR\" loading=\"lazy\"><div class=\"cred\">explorebiology · CC BY 4.0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">In vitro method for producing large amounts of specific DNA or RNA fragments of defined length and sequence from small amounts of short oligonucleotide flanking sequences (primers). The essential steps include thermal denaturation of the double-stranded target molecules, annealing of the primers to their complementary sequences, and extension of the annealed primers by enzymatic synthesis with DNA polymerase. The reaction is efficient, specific, and extremely sensitive. Uses for the reaction include disease diagnosis, detection of difficult-to-isolate pathogens, mutation analysis, genetic testing, DNA sequencing, and analyzing evolutionary relationships.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &quot;Polymerase Chain Reaction&quot;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 44, "nom": "RNA interference", "cat": "Technique", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>RNA interference<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e4/ShRNA_Lentivirus.svg/960px-ShRNA_Lentivirus.svg.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"RNA interference\" loading=\"lazy\"><div class=\"cred\">Dan Cojocari ✉·✍· · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">A gene silencing phenomenon whereby specific dsRNAs (RNA, DOUBLE-STRANDED) trigger the degradation of homologous mRNA (RNA, MESSENGER). The specific dsRNAs are processed into SMALL INTERFERING RNA (siRNA) which serves as a guide for cleavage of the homologous mRNA in the RNA-INDUCED SILENCING COMPLEX. DNA METHYLATION may also be triggered during this process.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;RNA Interference&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 49, "nom": "Real-time PCR", "cat": "Technique", "raresa": "comuna", "rlabel": "Common", "color": "#8a8f98", "sets": [], "html": "<article class=\"carta\" style=\"--r:#8a8f98\"><header><h2>Real-time PCR<\/h2><span>Common<\/span><\/header><div class=\"img\"><img src=\"https://upload.wikimedia.org/wikipedia/commons/4/4e/Qpcr-cycling.png?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail_unscaled\" alt=\"Real-time PCR\" loading=\"lazy\"><div class=\"cred\">Zuzanna K. Filutowska · CC BY-SA 3.0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">Methods used for detecting the amplified DNA products from the polymerase chain reaction as they accumulate instead of at the end of the reaction.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Real-Time Polymerase Chain Reaction&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}, {"id": 38, "nom": "Western blot", "cat": "Technique", "raresa": "poc_comuna", "rlabel": "Uncommon", "color": "#3f9b5c", "sets": [], "html": "<article class=\"carta\" style=\"--r:#3f9b5c\"><header><h2>Western blot<\/h2><span>Uncommon<\/span><\/header><div class=\"img\"><img src=\"https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/Western_blot_workflow.jpg/960px-Western_blot_workflow.jpg?utm_source=commons.wikimedia.org&amp;utm_campaign=imageinfo&amp;utm_content=thumbnail\" alt=\"Western blot\" loading=\"lazy\"><div class=\"cred\">Biochemlife · CC BY-SA 4.0<\/div><\/div><div class=\"cat\">Technique<\/div><p class=\"def\">Identification of proteins or peptides that have been electrophoretically separated by blot transferring from the electrophoresis gel to strips of nitrocellulose paper, followed by labeling with antibody probes.<\/p><p class=\"font\">Source: MeSH (NLM), descriptor &#x27;Blotting, Western&#x27;<\/p><ul class=\"stats\"><\/ul><\/article>", "icona": "<path d=\"M38 10h24M42 10v28L22 78a8 8 0 0 0 7 12h42a8 8 0 0 0 7-12L58 38V10\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"4\" stroke-linejoin=\"round\"/><path d=\"M30 64h40\" stroke=\"currentColor\" stroke-width=\"4\" opacity=\".6\"/>"}], "misions": [{"id": "set:nobel", "tipus": "col·lecció", "nom": "Collect all: Nobel laureates", "desc": "Own every card in this collection (15 cards). One-time badge.", "ids": [76, 71, 70, 79, 64, 66, 67, 73, 63, 78, 77, 61, 74, 65, 72], "premi": 225}, {"id": "set:cancer", "tipus": "col·lecció", "nom": "Collect all: Cancer", "desc": "Own every card in this collection (54 cards). One-time badge.", "ids": [69, 66, 10, 67, 73, 65, 68, 75, 72, 96, 99, 100, 95, 94, 97, 98, 26, 30, 34, 16, 19, 27, 23, 2, 13, 36, 28, 17, 32, 4, 25, 21, 33, 3, 35, 20, 31, 5, 22, 37, 24, 14, 15, 29, 1, 18, 88, 93, 89, 11, 90, 91, 87, 92], "premi": 810}, {"id": "set:cell-lines", "tipus": "col·lecció", "nom": "Collect all: Cell lines", "desc": "Own every card in this collection (9 cards). One-time badge.", "ids": [10, 88, 93, 89, 11, 90, 91, 87, 92], "premi": 135}, {"id": "set:oncogenes", "tipus": "col·lecció", "nom": "Collect all: Oncogenes", "desc": "Own every card in this collection (18 cards). One-time badge.", "ids": [26, 30, 34, 27, 23, 28, 32, 4, 25, 21, 33, 3, 35, 31, 5, 22, 24, 29], "premi": 270}, {"id": "set:suppressors", "tipus": "col·lecció", "nom": "Collect all: Tumor suppressors", "desc": "Own every card in this collection (10 cards). One-time badge.", "ids": [16, 19, 2, 13, 17, 20, 14, 15, 1, 18], "premi": 150}, {"id": "set:immunotherapy", "tipus": "col·lecció", "nom": "Collect all: Immunotherapy targets", "desc": "Own every card in this collection (2 cards). One-time badge.", "ids": [36, 37], "premi": 30}, {"id": "proto:Run a gel", "tipus": "protocol", "nom": "Run a gel", "desc": "Separate DNA fragments by size.", "ids": [47, 82, 81, 53], "premi": 25}, {"id": "proto:Build a PCR", "tipus": "protocol", "nom": "Build a PCR", "desc": "Amplify a DNA region.", "ids": [6, 8, 53, 47], "premi": 25}, {"id": "proto:Grow cells", "tipus": "protocol", "nom": "Grow cells", "desc": "Keep a cell line alive in culture.", "ids": [46, 57, 80, 59, 11], "premi": 25}, {"id": "proto:Find a protein", "tipus": "protocol", "nom": "Find a protein", "desc": "Detect one protein in a lysate.", "ids": [38, 84, 47, 85], "premi": 25}, {"id": "proto:Image the cell", "tipus": "protocol", "nom": "Image the cell", "desc": "Look at stained cells.", "ids": [9, 43, 50, 83], "premi": 25}, {"id": "proto:Sort cells", "tipus": "protocol", "nom": "Sort cells", "desc": "Count and sort cells by markers.", "ids": [7, 59, 46], "premi": 25}], "nomsSet": {"cancer": "Cancer", "oncogenes": "Oncogenes", "suppressors": "Tumor suppressors", "nobel": "Nobel laureates", "cell-lines": "Cell lines", "immunotherapy": "Immunotherapy targets"}}</script><script>
const CFG={packCost:50,cardsPerPack:5,startCoins:150,dailyFree:1,protoDailyCap:150,craftMult:4,
 weights:{comuna:55,poc_comuna:25,rara:12,epica:6,llegendaria:2},
 recycle:{comuna:5,poc_comuna:10,rara:25,epica:60,llegendaria:150}};
const D=JSON.parse(document.getElementById('dades').textContent);
const CARDS=D.cartes, MIS=D.misions, BYID=Object.fromEntries(CARDS.map(c=>[c.id,c]));
const KEY='bio-cards-save-v1', today=()=>new Date().toISOString().slice(0,10);
let S, memSave=null;
const fresh=()=>({coins:CFG.startCoins,owned:{},claimed:{},proto:{},lastFree:'',day:today(),dayCoins:0,opened:0});
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(fresh(),JSON.parse(r));}catch(e){}
 return memSave?JSON.parse(memSave):fresh();}
function save(){const j=JSON.stringify(S);memSave=j;try{localStorage.setItem(KEY,j);}catch(e){}}
S=load(); if(S.day!==today()){S.day=today();S.dayCoins=0;}
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let msgText='', view='packs', lastPack=[];
const setMsg=t=>{msgText=t;const m=$('#msg');if(m)m.textContent=t;};
const own=id=>S.owned[id]||0, craftCost=c=>CFG.recycle[c.raresa]*CFG.craftMult;

function rollRarity(){
 const have=new Set(CARDS.map(c=>c.raresa)); let tot=0;
 for(const r in CFG.weights) if(have.has(r)) tot+=CFG.weights[r];
 let x=Math.random()*tot;
 for(const r in CFG.weights){ if(!have.has(r)) continue; if((x-=CFG.weights[r])<0) return r; }
 return 'comuna';
}
function openPack(free){
 if(free){ if(S.lastFree===today()) return setMsg('Your free pack for today was already opened.'); S.lastFree=today(); }
 else { if(S.coins<CFG.packCost) return setMsg('Not enough coins.'); S.coins-=CFG.packCost; }
 lastPack=[];
 for(let i=0;i<CFG.cardsPerPack;i++){
  const pool=CARDS.filter(c=>c.raresa===rollRarity());
  const c=pool[Math.floor(Math.random()*pool.length)];
  lastPack.push({id:c.id,nou:own(c.id)===0 && !lastPack.some(p=>p.id===c.id)}); S.owned[c.id]=own(c.id)+1;
 }
 S.opened++; save(); setMsg(''); render();
}
function recycle(id){
 const c=BYID[id], v=CFG.recycle[c.raresa], last=own(id)===1;
 const t=`Recycle one copy of ${c.nom} for ${v} coins?`+(last?`\n\nIt is your LAST copy. Crafting it again costs ${craftCost(c)} coins.`:'');
 if(!confirm(t)) return; S.owned[id]--; if(!S.owned[id]) delete S.owned[id]; S.coins+=v; save(); setMsg(`+${v} coins.`); render();
}
function craft(id){
 const c=BYID[id], p=craftCost(c); if(S.coins<p) return setMsg('Not enough coins.');
 if(!confirm(`Craft ${c.nom} for ${p} coins?`)) return; S.coins-=p; S.owned[id]=1; save(); setMsg(`Crafted ${c.nom}.`); render();
}
const have=m=>m.ids.filter(i=>own(i)>0).length;
function claim(mid){
 const m=MIS.find(x=>x.id===mid); if(have(m)<m.ids.length) return;
 if(m.tipus==='protocol'){
  if(S.dayCoins+m.premi>CFG.protoDailyCap) return setMsg(`Daily protocol limit reached (${CFG.protoDailyCap} coins/day).`);
  S.dayCoins+=m.premi; S.proto[mid]=(S.proto[mid]||0)+1;
 } else { if(S.claimed[mid]) return; S.claimed[mid]=true; }
 S.coins+=m.premi; save(); setMsg(`+${m.premi} coins: ${m.nom}.`); render();
}
function slot(c,opts={}){
 const n=own(c.id);
 if(!n && opts.ghost) return `<div class="slot"><article class="carta ghost" style="--r:${c.color}"><header><h2>${esc(c.nom)}</h2><span>${c.rlabel}</span></header>
  <div class="img"><div class="sense-img"><svg viewBox="0 0 100 100">${c.icona}</svg><span>${c.cat}</span></div></div></article>
  <button class="btn" data-craft="${c.id}" ${S.coins<craftCost(c)?'disabled':''}>Craft · ${craftCost(c)} coins</button></div>`;
 return `<div class="slot ${opts.nou?'new':''}">${opts.nou?'<span class="badge">NEW</span>':''}${c.html}
  <div class="cnt">${opts.nou!==undefined?'':`Owned ×${n}`}</div>${opts.nou!==undefined?'':`<button class="btn" data-rec="${c.id}">Recycle one · +${CFG.recycle[c.raresa]}</button>`}</div>`;
}
function vPacks(){
 const free=S.lastFree!==today();
 let h=`<div class="row"><button class="btn pri" id="bFree" ${free?'':'disabled'}>Daily free pack</button>
  <button class="btn pri" id="bPack" ${S.coins<CFG.packCost?'disabled':''}>Open a pack · ${CFG.packCost} coins</button>
  <span class="cnt">${CFG.cardsPerPack} cards per pack · packs opened: ${S.opened}</span></div>`;
 if(lastPack.length) h+=`<div class="pack reveal">${lastPack.map((p,i)=>`<div style="animation-delay:${i*.25}s">${slot(BYID[p.id],{nou:p.nou})}</div>`).join('')}</div>`;
 else h+=`<p class="cnt">Open a pack to get cards. Duplicates can be recycled for coins in the Collection tab.</p>`;
 return h;
}
function vColl(){
 const f=window.F||(window.F={cat:'',st:'all',set:''});
 const cats=[...new Set(CARDS.map(c=>c.cat))].sort(), sets=[...new Set(CARDS.flatMap(c=>c.sets))].sort();
 let list=CARDS.filter(c=>(!f.cat||c.cat===f.cat)&&(!f.set||c.sets.includes(f.set))&&(f.st==='all'||(f.st==='owned')===(own(c.id)>0)));
 const total=Object.keys(S.owned).length;
 return `<div class="row"><b>${total} / ${CARDS.length} cards</b>
  <select id="fCat"><option value="">All categories</option>${cats.map(x=>`<option ${f.cat===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
  <select id="fSet"><option value="">All collections</option>${sets.map(x=>`<option value="${esc(x)}" ${f.set===x?'selected':''}>${esc(D.nomsSet[x]||x)}</option>`).join('')}</select>
  <select id="fSt">${[['all','All'],['owned','Owned'],['missing','Missing']].map(([v,l])=>`<option value="${v}" ${f.st===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="grid" style="padding:0">${list.map(c=>slot(c,{ghost:true})).join('')||'<p class="cnt">No cards match.</p>'}</div>`;
}
function vMis(){
 const row=m=>{const h=have(m),n=m.ids.length,ok=h===n,once=m.tipus!=='protocol',dn=once&&S.claimed[m.id];
  return `<div class="mis"><div class="info"><h3>${esc(m.nom)} <span class="cnt">· ${m.tipus}</span></h3><p>${esc(m.desc)}</p>
   <p>${m.ids.map(i=>`<span style="color:${own(i)?'#3f9b5c':'#6b7686'}">${esc(BYID[i].nom)}</span>`).join(' + ')}</p>
   <div class="bar"><i style="width:${100*h/n}%"></i></div></div>
   ${dn?'<span class="done">★ Badge earned</span>':`<button class="btn pri" data-claim="${esc(m.id)}" ${ok?'':'disabled'}>Claim +${m.premi}${once?'':' (repeatable)'}</button>`}
   ${!once&&S.proto[m.id]?`<span class="cnt">done ×${S.proto[m.id]}</span>`:''}</div>`;};
 return `<h2 class="sec">Protocols</h2><p class="cnt">Own all the cards to complete a protocol. Cards are not consumed. Daily limit: ${CFG.protoDailyCap} coins (used today: ${S.dayCoins}).</p>
  ${MIS.filter(m=>m.tipus==='protocol').map(row).join('')}<h2 class="sec">Collections</h2>${MIS.filter(m=>m.tipus!=='protocol').map(row).join('')}`;
}
function vSave(){
 return `<h2 class="sec">Save data</h2><p class="cnt">Your progress lives in this browser only. Copy the text below to back it up, or paste a backup and press Import.</p>
  <textarea id="sv">${esc(JSON.stringify(S))}</textarea><div class="row"><button class="btn" id="bImp">Import</button><button class="btn" id="bRes">Reset game</button></div>`;
}
function render(){
 $('#coins').textContent=`● ${S.coins} coins`;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
 $('#app').innerHTML=`<div class="msg" id="msg">${esc(msgText)}</div>`+({packs:vPacks,coll:vColl,mis:vMis,save:vSave}[view])();
 const on=(s,f)=>{const e=$(s);if(e)e.onclick=f;};
 on('#bFree',()=>openPack(true)); on('#bPack',()=>openPack(false));
 document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>recycle(+b.dataset.rec));
 document.querySelectorAll('[data-craft]').forEach(b=>b.onclick=()=>craft(+b.dataset.craft));
 document.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>claim(b.dataset.claim));
 [['#fCat','cat'],['#fSet','set'],['#fSt','st']].forEach(([s,k])=>{const e=$(s);if(e)e.onchange=()=>{window.F[k]=e.value;render();};});
 on('#bImp',()=>{try{const o=JSON.parse($('#sv').value);if(typeof o.coins!=='number'||typeof o.owned!=='object')throw 0;S=Object.assign(fresh(),o);save();setMsg('Imported.');render();}catch(e){setMsg('That is not a valid backup.');}});
 on('#bRes',()=>{if(confirm('Delete all progress?')){S=fresh();save();lastPack=[];setMsg('Game reset.');render();}});
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;setMsg('');render();});
render();
</script></html>
